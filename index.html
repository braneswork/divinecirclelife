    ${[0,12,24].filter(h=>h<=hrs).map(h=>`<text x="${X(h)}" y="${H-4}" fill="var(--muted)" font-size="${wide?11:10.5}" font-family="Inter,sans-serif" text-anchor="${h===0?'start':(h>=24?'end':'middle')}">${h===0?'medianoche':(h===12?'mediodía':'medianoche')}</text>`).join('')}
    <path d="${area}" fill="url(#tg)"/>
    <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${lessons.map(l=>`<line x1="${X(l.x)}" y1="${H-PB}" x2="${X(l.x)}" y2="${H-PB+5}" stroke="var(--fg)" stroke-width="2" opacity=".55"/>
      <circle cx="${X(l.x)}" cy="${Y(tideAt(d0+l.x))}" r="3.5" fill="var(--bg)" stroke="var(--fg)" stroke-width="2"/>`).join('')}
    ${n.day.map(e=>`<circle cx="${X(e.x-d0)}" cy="${Y(e.h)}" r="2.5" fill="var(--muted)"/>
      <text x="${X(e.x-d0)}" y="${e.type==='high'?Y(e.h)-9:Y(e.h)+16}" fill="var(--muted)" font-size="${wide?11.5:11}" font-family="Inter,sans-serif" font-weight="600" text-anchor="middle">${e.type==='high'?'▲':'▼'} ${tideClock(e.x)}</text>`).join('')}
    <line x1="${nx}" y1="${PT-6}" x2="${nx}" y2="${H-PB}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="3 3"/>

/* ---------------- mini curva de marea con el punto del momento ----------------
   Misma forma que la curva grande, pero angosta: se ve de un vistazo si la clase
   cae en marea llena, vacía, subiendo o bajando. */
function tideSpark(base, idx, w, h){
  const c=DB.tideCache; if(!c) return '';
  if(base===null || base===undefined) return '';
  if(base<0 || base+24>c.level.length-1) return '';
  w=w||88; h=h||24;
  const PT=3, PB=3;
  const pts=[]; for(let x=0;x<=24;x+=0.5) pts.push([x,tideAt(base+x)]);
  const lo=Math.min(...pts.map(p=>p[1])), hi=Math.max(...pts.map(p=>p[1])), rng=(hi-lo)||1;
  const X=v=>(v/24)*w, Y=v=>PT+(1-(v-lo)/rng)*(h-PT-PB);
  const path=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  const rel=idx-base;
  const inside = rel>=0 && rel<=24;
  const cx=X(Math.max(0,Math.min(24,rel))), cy=Y(tideAt(base+Math.max(0,Math.min(24,rel))));
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <path d="${path} L ${w} ${h-PB} L 0 ${h-PB} Z" fill="var(--fg)" opacity=".10"/>
    <path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linejoin="round"/>
    ${inside?`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3" fill="var(--red)" stroke="var(--card)" stroke-width="1.4"/>`:''}
  </svg>`;
}
/* la misma curva, a partir de una fecha y hora sueltas */
function tideSparkAt(iso, time, w, h){
  const c=DB.tideCache; if(!c||!iso||!DB.settings.tide.on) return '';
  const mid=new Date(iso+'T00:00'); if(isNaN(mid)) return '';
  const base=(mid.getTime()-new Date(c.time[0]+':00').getTime())/3600000;
  let hhmm=(time||'').slice(0,5);
  if(hhmm.length!==5 || hhmm[2]!==':') hhmm='09:00';
  const idx=base+Number(hhmm.slice(0,2))+Number(hhmm.slice(3))/60;
  return tideSpark(base, idx, w, h);
}

/* ---------------- condiciones de un servicio concreto ---------------- */
const SEA_CATS=['experiencias'];
function condAt(iso, time){
  if(!DB.settings.tide.on || !DB.tideCache || !iso) return null;
  let hhmm=(time||'').slice(0,5);
  if(hhmm.length!==5 || hhmm[2]!==':' || isNaN(Number(hhmm.slice(0,2))) || isNaN(Number(hhmm.slice(3)))) hhmm='09:00';
  const d=new Date(iso+'T'+(hhmm.length===5?hhmm:'09:00')+':00');
  if(isNaN(d)) return null;
  const idx=tideIndexAt(d); if(idx===null) return null;
  const m=marAt(idx), c=DB.tideCache;
  return {idx, m, tide:tideAt(idx),
    rising: tideAt(Math.min(idx+0.25, c.level.length-1)) > tideAt(idx),
    sr:surfRange(m.wave!==null?m.wave:m.swH),
    wk:windKind(m.windDir, c.face||DB.settings.tide.face),
    rate:rateLesson(m)};
}

  [-84.944,9.810],[-84.953,9.823],[-84.965,9.836],[-84.980,9.848],
  /* borde norte, recto: la península sigue pero acá se corta */
  [-85.010,9.858],[-85.060,9.866],[-85.120,9.873],[-85.180,9.878],[-85.245,9.882]
];
function compass(sel, m, face){
  const S=300, C=S/2, R=116;
  const lngs=NICOYA.map(p=>p[0]), lats=NICOYA.map(p=>p[1]);
  const minX=Math.min(...lngs), maxX=Math.max(...lngs), minY=Math.min(...lats), maxY=Math.max(...lats);
  const sc=Math.min(150/(maxX-minX), 150/(maxY-minY))*0.92;
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const P=p=>[C+(p[0]-cx)*sc, C-(p[1]-cy)*sc];
  const land=NICOYA.map((p,i)=>(i?'L':'M')+P(p).map(v=>v.toFixed(1)).join(' ')).join('')+'Z';
  const spot=P([DB.settings.tide.lng, DB.settings.tide.lat]);
  /* flecha: viene DESDE la dirección dada y apunta al centro */
  const arrow=(fromDeg,len,color,w,dash)=>{
    if(fromDeg===null||fromDeg===undefined) return '';
    const a=(fromDeg-90)*Math.PI/180;
    const x1=C+Math.cos(a)*R, y1=C+Math.sin(a)*R;
    const x2=C+Math.cos(a)*(R-len), y2=C+Math.sin(a)*(R-len);
    const ah=(d)=>[x2+Math.cos(a+Math.PI+d)*11, y2+Math.sin(a+Math.PI+d)*11];
    const p1=ah(0.42), p2=ah(-0.42);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
        stroke="${color}" stroke-width="${w}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/>
      <path d="M${x2.toFixed(1)} ${y2.toFixed(1)} L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L${p2[0].toFixed(1)} ${p2[1].toFixed(1)} Z" fill="${color}"/>`;
  };
  const selD = sel==='sw2' ? m.sw2D : (sel==='ww' ? m.wwD : (m.swD!==null?m.swD:m.dir));
  const selH = sel==='sw2' ? m.sw2H : (sel==='ww' ? m.wwH : (m.swH!==null?m.swH:m.wave));
  const selP = sel==='sw2' ? m.sw2P : (sel==='ww' ? m.wwP : (m.swP!==null?m.swP:m.period));
  return `<div class="compasswrap"><svg viewBox="0 0 ${S} ${S}" width="100%" style="display:block;width:100%">
    <circle cx="${C}" cy="${C}" r="${R+16}" fill="var(--soft)"/>
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--line)" stroke-width="1"/>
    <circle cx="${C}" cy="${C}" r="${R*0.62}" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 5"/>
    ${[0,45,90,135,180,225,270,315].map(d=>{
      const a=(d-90)*Math.PI/180, r1=R+2, r2=R+ (d%90?7:11);
      return `<line x1="${(C+Math.cos(a)*r1).toFixed(1)}" y1="${(C+Math.sin(a)*r1).toFixed(1)}"
        x2="${(C+Math.cos(a)*r2).toFixed(1)}" y2="${(C+Math.sin(a)*r2).toFixed(1)}" stroke="var(--muted)" stroke-width="1"/>`;}).join('')}
    ${[['N',0],['E',90],['S',180],['O',270]].map(([l,d])=>{
      const a=(d-90)*Math.PI/180, r=R+27;
      return `<text x="${(C+Math.cos(a)*r).toFixed(1)}" y="${(C+Math.sin(a)*r+4).toFixed(1)}" text-anchor="middle"
        font-size="13" font-weight="700" font-family="Inter,sans-serif" fill="var(--muted)">${l}</text>`;}).join('')}
    <path d="${land}" fill="var(--fg)" opacity=".16" stroke="var(--fg)" stroke-opacity=".45" stroke-width="1.4" stroke-linejoin="round"/>
    ${arrow(m.windDir, 34, 'var(--muted)', 2, '4 4')}
    ${arrow(selD, 52, 'var(--blue)', 3.5)}
    ${[['Cabo Blanco',-85.095,9.556],['Tambor',-84.995,9.661],['Paquera',-84.952,9.740]]
      .map(([nm,lo,la])=>{ const q=P([lo,la]);
        return `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2" fill="var(--muted)"/>
        <text x="${(q[0]+5).toFixed(1)}" y="${(q[1]+3.5).toFixed(1)}" font-size="8.5" font-family="Inter,sans-serif" fill="var(--muted)">${nm}</text>`;}).join('')}
    <circle cx="${spot[0].toFixed(1)}" cy="${spot[1].toFixed(1)}" r="5.5" fill="var(--red)" stroke="var(--bg)" stroke-width="2.5"/>
    <text x="${(spot[0]-10).toFixed(1)}" y="${(spot[1]+4).toFixed(1)}" text-anchor="end" font-size="11.5" font-weight="700"
      font-family="Inter,sans-serif" fill="var(--fg)" paint-order="stroke" stroke="var(--bg)" stroke-width="3">${esc(DB.settings.tide.spot||'')}</text>
  </svg>
  <div class="row" style="gap:8px;align-items:baseline;justify-content:center;margin-top:2px;flex-wrap:nowrap;white-space:nowrap">
    <b style="font-family:'Montserrat',sans-serif;font-size:23px;letter-spacing:.04em">${selD!==null&&selD!==undefined?dirName(selD):'—'}</b>
    <span class="hint">${selD!==null&&selD!==undefined?Math.round(selD)+'°':''}${selP!==null&&selP!==undefined?' · '+Math.round(selP)+' s':''}</span>
    ${selH!==null&&selH!==undefined?`<b class="mono" style="color:var(--blue)">${m2ft(selH).toFixed(1)} ft</b>`:''}
  </div></div>`;
}

/* ---------------- VISTA: FORECAST ---------------- */
const BLOCKS=[[6,'Temprano'],[8,'Mañana'],[10,'Media mañana'],[12,'Mediodía'],[14,'Tarde'],[16,'Tardecita'],[17,'Atardecer']];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function fcDays(){
  const c=DB.tideCache; if(!c) return [];
  const d0=tideDayStart(); if(d0===null) return [];
  const n=Math.min(4, Math.floor((c.level.length-1-d0)/24));
  const out=[];
  for(let d=0; d<n; d++){
    const dt=new Date(); dt.setDate(dt.getDate()+d);
    out.push({d, base:d0+d*24, iso:dt.toISOString().slice(0,10),
      label: d===0?'Hoy' : d===1?'Mañana' : DIAS[dt.getDay()].slice(0,3)+' '+dt.getDate()});
  }
  return out;
}
/* la hora "de referencia" del día: ahora si es hoy, si no las 9am */
function fcHour(day){
  if(UI.fcHour!==null && UI.fcHour!==undefined) return day.base+UI.fcHour;
  if(day.d===0){ const n=tideNow(); if(n) return n.idx; }
  return day.base+9;
}
function viewForecast(){
  const c=DB.tideCache, t=DB.settings.tide;
  if(!t.on) return `<div class="empty"><div class="big">Parte de mar desactivado</div>
    <div class="hint">Activalo en Ajustes → Datos.</div></div>`;
  if(!c || tideDayStart()===null) return `<div class="empty"><div class="big">Todavía sin datos</div>
    <div class="hint">Conectate un momento y tocá actualizar.</div>
    <button class="btn" style="margin-top:12px" data-act="tide-refresh">Actualizar ahora</button></div>`;
  const days=fcDays(); const day=days[Math.min(UI.fcDay||0, days.length-1)];
  const face=c.face||t.face||250;
  const idx=fcHour(day);
  const m=marAt(idx), tide=tideAt(idx), wk=windKind(m.windDir,face);
  const sr=surfRange(m.wave!==null?m.wave:m.swH);
  const rs=rateSurf(m), rl=rateLesson(m), wx=wxWord(m.code);
  const ext=tideExtremes(day.base, day.base+24);
  const sel=UI.fcSwell||'sw';
  const swOpts=[['sw','Principal',m.swH,m.swP,m.swD],['sw2','Secundario',m.sw2H,m.sw2P,m.sw2D],['ww','Viento-mar',m.wwH,m.wwP,m.wwD]]
    .filter(o=>o[2]!==null&&o[2]!==undefined&&o[2]>0.1);
  const hourNow = Math.round(idx-day.base);

  /* clases del día, se muestran a lo ancho más abajo */
  const les=[];
  DB.bookings.forEach(bk=>(bk.items||[]).forEach(it=>{
    if((it.date||bk.date)===day.iso && it.time && ['lesson','camp','kids','corp','activity'].includes(it.cat))
      les.push({t:it.time,who:bk.client,name:it.name,qty:it.qty,b:bk,it});
  }));
  les.sort((x,y)=>x.t.localeCompare(y.t));

  return `
  <div class="chiprow" style="margin-bottom:10px">
    ${days.map(x=>`<button class="chip ${x.d===day.d?'on':''}" data-act="fcday" data-v="${x.d}">${x.label}</button>`).join('')}
    <button class="chip" data-act="tide-refresh">↻</button>
  </div>

  <div class="fcgrid split">
    <div class="fc-a">
      <div class="card hero tidecard">
        <div class="between" style="align-items:flex-start">
          <div style="min-width:0">
            <div class="eyebrow">Altura de ola${(UI.fcHour!==null&&UI.fcHour!==undefined)?' · '+String(UI.fcHour).padStart(2,'0')+':00':(day.d?' · 09:00':' · ahora')}</div>
            <div class="surfh mono">${sr?`${sr.lo.toFixed(1)}–${sr.hi.toFixed(1)} m`:'—'}</div>
            <div class="surfft">${sr?`${m2ft(sr.lo).toFixed(1)}–${m2ft(sr.hi).toFixed(1)} ft`:''}</div>
            <div class="slang">${sr?esc(sr.slang):''}</div>
          </div>
          <div style="text-align:right;flex:0 0 auto">
            <div class="wxbig">${wx[1]}</div>
            ${m.temp!==null?`<div class="tempbig mono">${Math.round(m.temp)}°</div>`:''}
            <div class="hint">${esc(wx[0])}</div>
          </div>
        </div>
        <div class="row" style="gap:7px;flex-wrap:wrap;margin-top:11px">
          ${rs?`<span class="rate ${rs.tag}">Surf · ${rs.label}</span>`:''}
          ${rl?`<span class="rate ${rl.tag}">Clases · ${rl.label}</span>`:''}
        </div>
      </div>

      <div class="card">
        <div class="h2" style="margin-bottom:8px">Condiciones y clima</div>
        <div class="kv">
          ${swOpts.map(o=>`<div><span class="eyebrow">${o[1]}</span><b>${m2ft(o[2]).toFixed(1)} ft</b>
            <span class="hint">${Math.round(o[3])} s · ${dirName(o[4])}</span></div>`).join('')}
          ${m.wave!==null?`<div><span class="eyebrow">Mar total</span><b>${m2ft(m.wave).toFixed(1)} ft</b><span class="hint">${m.wave.toFixed(1)} m</span></div>`:''}
          ${m.wind!==null?`<div><span class="eyebrow">Viento</span><b style="color:${wk&&wk.tag==='green'?'var(--green)':(wk&&wk.tag==='red'?'var(--red)':'inherit')}">${Math.round(m.wind)} kt ${dirName(m.windDir)}</b>
            <span class="hint">${wk?wk.label:''}${m.gust!==null?' · ráf '+Math.round(m.gust):''}</span></div>`:''}
          <div><span class="eyebrow">Marea</span>
            <b>${tide.toFixed(2)} m</b>
            <div style="margin-top:2px">${tideSpark(day.base, idx, 96, 24)}</div>
            <span class="hint">${(()=>{const nx=ext.find(e=>e.x>idx); return nx?(nx.type==='high'?'sube a ':'baja a ')+nx.h.toFixed(1)+' m · '+tideClock(nx.x):'';})()}</span></div>
        </div>
        <div style="margin-top:10px">
          ${wxBlock(m, {sun:(c.sunrise||[])[day.d] ? c.sunrise[day.d].slice(11,16)+' – '+((c.sunset||[])[day.d]||'').slice(11,16) : ''})}
        </div>
      </div>
    </div>

    <div class="fc-b">
  <div class="card">
    <div class="between" style="margin-bottom:6px"><div class="h2">Clases de ese día</div>
      <span class="tag">${les.length}</span></div>
    ${les.length? `<div class="clsgrid">${les.map(l=>{
        const hh=Number(String(l.t).slice(0,2)), mi=Number(String(l.t).slice(3,5))||0;
        const bi=day.base+hh+mi/60, mm=marAt(bi), w2=windKind(mm.windDir,face), r2=rateLesson(mm);
        const s2=surfRange(mm.wave!==null?mm.wave:mm.swH);
        const crew=crewFilled(l.it), open=crewOpen(l.it);
        const cond=[s2?s2.lo.toFixed(1)+'–'+s2.hi.toFixed(1)+' m':'',
                    mm.wind!==null?Math.round(mm.wind)+' kt '+(w2?w2.label:''):'',
                    'marea '+tideAt(bi).toFixed(1)].filter(Boolean).join(' · ');
        return `<div class="line clsrow" style="background:var(--card);margin-top:0">
          <div class="between" style="align-items:center;gap:8px">
            <div style="min-width:0">
              <b>${esc(l.t)}</b> <span>${esc(l.who||'')}</span>
              <span class="hint"> · ${l.qty} pax</span>
              <div class="hint">${esc(cond)}</div>
            </div>
            ${tideSpark(day.base, bi, 64, 24)}
            <div style="text-align:right;flex:0 0 auto">
              ${r2?`<span class="rate ${r2.tag}" style="font-size:11px;padding:2px 7px">${r2.label}</span>`:''}
              <div class="hint" style="margin-top:2px">${crew.length?crew.map(x=>esc(x.name.split(' ')[0])).join(', '):(open.length?`<b style="color:var(--red)">${open.length} sin cubrir</b>`:'—')}</div>
            </div>
          </div>
        </div>`;}).join('')}</div>`
      : `<div class="hint">Ninguna agendada${day.d===0?' para hoy':''}.</div>`}
  </div>
    </div>

    <div class="fc-c">
      <div class="card">
        <div class="between" style="margin-bottom:6px"><div class="h2">De dónde viene</div>
          ${m.windDir!==null?`<span class="tag">Viento ${dirName(m.windDir)}</span>`:''}</div>
        ${swOpts.length>1?`<div class="chiprow" style="margin-bottom:6px">
          ${swOpts.map(o=>`<button class="chip ${sel===o[0]?'on':''}" data-act="fcswell" data-v="${o[0]}">${o[1]}</button>`).join('')}
        </div>`:''}
        ${compass(sel, m, face)}
        <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px;justify-content:center">
          <span class="tag blue">Flecha llena · swell</span>
          <span class="tag">Punteada · viento</span>
        </div>
      </div>

      <div class="card">
        <div class="h2" style="margin-bottom:7px">Marea del día</div>
        <div class="row" style="gap:5px;flex-wrap:wrap;margin-bottom:4px">${ext.map(e=>`<span class="tag ${e.type==='high'?'blue':''}">${e.type==='high'?'▲':'▼'} ${tideClock(e.x)} · ${e.h.toFixed(1)} m</span>`).join('')}</div>
        ${fcTideChart(day)}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="h2" style="margin-bottom:6px">Hora por hora</div>
    <div class="hint" style="margin-bottom:8px">Tocá una hora para ver todo arriba con esos datos.</div>
    <table class="tbl">
      <tr><th>Hora</th><th>Ola (m)</th><th>Viento</th><th class="r">Marea</th><th class="r">Surf</th></tr>
      ${BLOCKS.map(([h,lab])=>{
        const mm=marAt(day.base+h), w2=windKind(mm.windDir,face), r2=rateSurf(mm);
        const s2=surfRange(mm.wave!==null?mm.wave:mm.swH);
        const on=(h===hourNow);
        return `<tr data-act="fchour" data-v="${h}" style="cursor:pointer;${on?'background:var(--soft)':''}">
          <td style="white-space:nowrap"><b>${String(h).padStart(2,'0')}:00</b><div class="hint">${lab}</div></td>
          <td style="white-space:nowrap">${s2?`<b>${s2.lo.toFixed(1)}–${s2.hi.toFixed(1)}</b><div class="hint">${m2ft(s2.lo).toFixed(0)}–${m2ft(s2.hi).toFixed(0)} ft</div>`:'—'}</td>
          <td style="white-space:nowrap">${mm.wind!==null?`<b style="color:${w2&&w2.tag==='green'?'var(--green)':(w2&&w2.tag==='red'?'var(--red)':'inherit')}">${Math.round(mm.wind)}kt</b> ${dirName(mm.windDir)}<div class="hint">${w2?w2.label:''}</div>`:'—'}</td>
          <td class="r mono">${tideAt(day.base+h).toFixed(1)}</td>
          <td class="r">${r2?`<span class="dot ${r2.tag}"></span><div class="hint">${r2.label}</div>`:''}</td>
        </tr>`;}).join('')}
    </table>
  </div>

  <div class="hint" style="margin:10px 2px 0">
    Open-Meteo, modelo global de 8 km · actualizado ${new Date(c.at).toLocaleString('es-CR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}.
    La altura de ola es una estimación a partir de la altura significativa del mar, no una medición de la ola rompiendo.
    El viento local de la tarde puede variar bastante. Cuanto más lejos el día, menos confiable.
  </div>`;
}
function fcTideChart(day){
  const c=DB.tideCache, w=window.innerWidth;
  const wide=w>=1000, mid=w>=900&&w<1000;
  const W=wide?480:(mid?900:400), H=wide?104:(mid?132:112), PL=4,PR=4,PT=14,PB=22;
  const pts=[]; for(let x=0;x<=24;x+=0.25) pts.push([x,tideAt(day.base+x)]);
  const lo=Math.min(...pts.map(p=>p[1])), hi=Math.max(...pts.map(p=>p[1])), rng=(hi-lo)||1;
  const X=x=>PL+(x/24)*(W-PL-PR), Y=v=>PT+(1-(v-lo)/rng)*(H-PT-PB);
  const path=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  const idx=fcHour(day)-day.base;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;width:100%;height:auto">
    <defs><linearGradient id="tg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--gold)" stop-opacity=".18"/><stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
    ${[0,6,12,18,24].map(h=>`<line x1="${X(h)}" y1="${PT-4}" x2="${X(h)}" y2="${H-PB}" stroke="var(--line)"/>
      <text x="${X(h)}" y="${H-6}" fill="var(--muted)" font-size="${wide?11:10.5}" font-family="Inter,sans-serif" text-anchor="${h===0?'start':(h===24?'end':'middle')}">${String(h).padStart(2,'0')}h</text>`).join('')}
    <path d="${path} L ${X(24)} ${H-PB} L ${X(0)} ${H-PB} Z" fill="url(#tg2)"/>
    <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/>
    ${(idx>=0&&idx<=24)?`<line x1="${X(idx)}" y1="${PT-6}" x2="${X(idx)}" y2="${H-PB}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="${X(idx)}" cy="${Y(tideAt(day.base+idx))}" r="5" fill="var(--red)"/>`:''}
  </svg>`;
}

/* ============================ avisos de rentas ============================ */
function checkRentals(){
  let changed=false, hits=[];
  DB.bookings.forEach(b=>(b.items||[]).forEach(it=>{
    if(it.cat!=='rental' || it.returned || it.notified) return;
    const due=rentalDue(it); if(!due) return;
    if(Date.now()>=due.getTime()){ it.notified=true; changed=true; hits.push((b.client||'Cliente')+' · '+it.name); }
  }));
  if(!changed) return;
  save();
  const msg = hits.length===1 ? hits[0]+' — se venció' : hits.length+' rentas vencidas';
  toast('⏰ '+msg);
  try{
    if(DB.settings.notify && window.Notification && Notification.permission==='granted')
      new Notification('Divine Circle · renta vencida',{body:hits.join('\n')});
  }catch(e){}
  if(TAB==='hoy'||TAB==='rentas') render();
}
setInterval(checkRentals, 60000);
setTimeout(checkRentals, 2500);
setTimeout(()=>{ autoSave(); }, 1500);
setInterval(()=>autoSave(), 60*60000);
setTimeout(()=>tideLoad(), 900);
setInterval(()=>tideLoad(), 10*60000);            // revisa cada 10 min, baja solo si pasó 1 h
window.addEventListener('online', ()=>tideLoad());
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) tideLoad(); });

/* ============================ lock ============================ */
function tryUnlock(){
  if($('#pinInput').value === (DB.settings.pin||'')){ $('#lock').style.display='none'; }
  else { $('#pinMsg').textContent='PIN incorrecto'; $('#pinInput').value=''; }
}
$('#pinInput').addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });

/* ============================ arranque ============================ */
function startApp(){
  buildNav();
  applyTheme();
  if(DB.settings.pin){ $('#lock').style.display='flex'; setTimeout(()=>$('#pinInput').focus(),200); }
  go('ventas');
  save();
}

async function boot(){
  applyTheme();
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    document.getElementById('cloudLogin').style.display='flex';
    return;
  }
  if(hasPending()){
    /* quedaron cambios de una sesión offline sin subir: los empujamos
       primero en vez de traer la versión vieja del servidor y perderlos */
    setSyncBadge('busy','Subiendo cambios pendientes…');
    cloudSave();
    startApp();
    return;
  }
  setSyncBadge('busy','Cargando desde Supabase…');
  const cloudDB = await cloudLoad();
  if(cloudDB) DB = cloudDB;
  startApp();
}
boot();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
