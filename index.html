<style>
:root{
  --ink:#241128;
  --bone:#FBF5EA;
  --paper:#FFFFFF;
  --sand:#F0E4CF;
  --line:#E7DBC9;
  --muted:#7A6A72;
  --keyline:#241128;
  --bg:#FBF5EA;
  --fg:#241128;
  --card:#FFFFFF;
  --soft:#F7EFE0;
  --shadow:rgba(51,8,47,.14);
  --green:#3F9C6E;
  --green-soft:#DCF2E9;
  --red:#E0776A;
  --red-soft:#FBE3DF;
  --blue:#B0187E;
  --blue-soft:#F6E2EF;
  --amber:#96690E;
  --amber-soft:#FBEEDA;
  --gold:#E3A83E;
  --gold-light:#F4CE7C;
  --r:17px;
  --nav-h:64px;
}
html[data-theme="dark"]{
  --ink:#F7ECF2;
  --bg:#33082F;
  --fg:#F7ECF2;
  --card:#45103F;
  --soft:#3D0C3A;
  --line:#5C2A56;
  --muted:#CFA9C6;
  --keyline:#5C1153;
  --paper:#45103F;
  --sand:#3D0C3A;
  --shadow:rgba(0,0,0,.5);
  --green:#3BD494; --green-soft:#12291F;
  --red:#FF6B52;   --red-soft:#2C1714;
  --blue:#E3A83E;  --blue-soft:#2A0E28;
  --amber:#F0B94E; --amber-soft:#2A2113;
  --gold:#E3A83E;  --gold-light:#F4CE7C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(120% 55% at 50% -12%, color-mix(in srgb, var(--gold) 16%, transparent), transparent 60%),
    var(--bg);
  color:var(--fg);
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior-y:none;
}
html[data-theme="dark"] body{
  background:
    radial-gradient(120% 55% at 50% -12%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 60%),
    linear-gradient(180deg, #3D0C3A 0%, #5C1153 100%);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
.mono{font-variant-numeric:tabular-nums}

/* ---------- utility type ---------- */
.eyebrow{
  font-family:'Montserrat',sans-serif;
  text-transform:uppercase;letter-spacing:.14em;font-weight:600;
  font-size:12.5px;color:var(--muted);
}
.title{font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:25px;line-height:1.1}
.h2{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;letter-spacing:0}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100%;flex-direction:column}
.sidebar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;flex-direction:column;
  background:color-mix(in srgb, var(--card) 82%, transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.navmain{display:flex;align-items:stretch;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.navmain::-webkit-scrollbar{display:none}
.navsub{display:none;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:6px;padding:0 10px 8px;border-top:1px solid var(--line)}
.navsub.show{display:flex}
.navsub::-webkit-scrollbar{display:none}
.subbtn{
  flex:0 0 auto;border:1px solid var(--line);background:none;border-radius:999px;cursor:pointer;
  padding:5px 13px;margin-top:8px;
  font-family:'Montserrat',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.03em;
  text-transform:uppercase;color:var(--muted);
}
.subbtn.on{color:var(--gold);border-color:var(--gold)}
.brand{display:none}
.navgroup{display:none}
.navsep{flex:0 0 auto;width:1px;align-self:stretch;margin:10px 3px;background:var(--line)}
.navbtn{
  flex:0 0 auto;min-width:60px;border:0;background:none;cursor:pointer;padding:8px 9px 7px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:'Montserrat',sans-serif;text-transform:uppercase;
  letter-spacing:.02em;font-weight:600;font-size:10px;color:var(--muted);
}
@media(min-width:400px){.navbtn{font-size:10.5px;letter-spacing:.04em}}
@media(min-width:700px){.navbtn{font-size:11.5px;padding:9px 15px 8px;min-width:76px}}
.navbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbtn.on{color:var(--gold)}
.navbtn.on svg{stroke-width:2.2}
.main{flex:1;padding:0 0 calc(var(--nav-h) + 18px)}
.topbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(16px);
  padding:10px 14px 10px;border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top));
}
.topbar-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.topbar-left{grid-column:1;min-width:0;overflow:hidden}
.topbar-brand{grid-column:2;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
.topbar-brand .title{font-size:14.5px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.topbar-brand .eyebrow{font-size:9.5px;letter-spacing:.08em}
.topbar-actions{grid-column:3;display:flex;align-items:center;gap:2px;justify-content:flex-end}
.topbar img.logo{height:40px;width:auto;display:block;margin-bottom:1px}
.topbar .spacer{display:none}
.wrap{padding:12px 14px 0;max-width:760px;margin:0 auto}

@media(min-width:900px){
  .main{padding-bottom:calc(var(--nav-h) + 40px)}
  .topbar{padding:14px 24px 12px}
  .wrap{padding:14px 24px 0;max-width:1180px}
  .topbar-brand .title{font-size:15.5px}
  .sidebar{padding-top:6px}
  .navbtn{padding-top:11px}
}

/* ---------- cards & controls ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:12px}
.sticker{border:1.5px solid var(--gold);box-shadow:0 4px 14px var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;gap:12px}
@media(min-width:760px){.grid.g2{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.grid.g3{grid-template-columns:repeat(3,1fr)}}

.btn{
  border:1.5px solid var(--keyline);background:var(--fg);color:var(--bg);
  border-radius:9px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.soft{background:var(--soft);color:var(--fg);border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:7px}
.btn.danger{background:var(--red);border-color:transparent;color:#fff}
.btn.ghost.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.icon-btn{
  border:1px solid var(--line);background:var(--card);border-radius:9px;
  width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input,select,textarea{
  width:100%;background:var(--paper);border:1px solid var(--line);border-radius:9px;
  padding:9px 10px;outline:none;
}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:var(--soft)}
input:focus,select:focus,textarea:focus{border-color:var(--fg)}
label.f{display:block}
label.f .eyebrow{margin-bottom:4px;display:block;font-size:11.5px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;
  font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:13px;
}
.chip.on{background:transparent;color:var(--fg);border-color:var(--gold);border-width:2px;box-shadow:inset 0 -3px 0 -1px var(--gold)}
.tag{
  display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:2px 7px;
  font-size:11.5px;font-weight:600;background:var(--soft);color:var(--muted);
  font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:12px;
}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag{white-space:nowrap}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.alert .icon-btn{width:28px;height:28px;border-color:transparent;background:transparent;opacity:.6}
.alert .icon-btn:hover{opacity:1}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:16px;color:var(--fg);margin-bottom:4px}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- stage rail ---------- */
.rail{display:flex;gap:3px;align-items:stretch}
.rail{gap:3px}
.rail button{
  min-width:0;flex:1;border:0;cursor:pointer;background:var(--soft);color:var(--muted);
  padding:5px 2px 4px;font-family:'Montserrat',sans-serif;text-transform:uppercase;
  letter-spacing:0;font-weight:600;font-size:10px;line-height:1.06;
  border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  text-align:center;word-break:break-word;hyphens:auto;
}
@media(min-width:420px){.rail button{font-size:11px;letter-spacing:.02em}}
@media(min-width:620px){.rail button{font-size:12px;letter-spacing:.06em;padding:5px 4px 4px}}
.rail button.done{background:color-mix(in srgb,var(--fg) 16%,transparent);color:var(--fg)}
.rail button.cur{background:var(--fg);color:var(--bg)}

/* ---------- booking card ---------- */
.bk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bk-head{padding:11px 12px 9px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.bk-code{
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.08em;
  background:var(--fg);color:var(--bg);border-radius:6px;padding:1px 7px;flex:0 0 auto;margin-top:2px;
}
.bk-name{font-weight:600;font-size:15px;line-height:1.2}
.bk-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.bk-amt{text-align:right;flex:0 0 auto;font-weight:700}
.bk-body{border-top:1px solid var(--line);padding:12px}

/* ---------- item line ---------- */
.line{border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--soft)}
.line + .line{margin-top:9px}
.line-top{display:flex;gap:8px;align-items:flex-start}
.line-title{flex:1;font-weight:600;font-size:14px;line-height:1.25}
.pay{
  width:30px;height:30px;border-radius:8px;border:0;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;
}
.pay.paid{background:var(--green)} .pay.pending{background:var(--red)} .pay.credit{background:var(--blue)}
html[data-theme="dark"] .pay{color:#0E0E10}
.line-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.line-grid label .eyebrow{font-size:10.5px;letter-spacing:.1em}
.line-grid input,.line-grid select{padding:7px 7px;font-size:13.5px;border-radius:8px}
@media(max-width:520px){.line-grid{grid-template-columns:repeat(2,1fr)}}
.assigns{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.asg{
  display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 5px 3px 8px;
  font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card);
}
.asg.paid{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.asg .x{cursor:pointer;opacity:.55;font-weight:700;padding:0 2px}
.asg .money{cursor:pointer;font-variant-numeric:tabular-nums}
.asg.slot{border-style:dashed;border-color:var(--muted);color:var(--muted);cursor:pointer;padding:3px 9px}
.asg.slot b{color:var(--fg)}
.asg.slot.wait{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.asg.slot.wait b{color:var(--amber)}
.avatar{border-radius:50%;object-fit:cover;flex:0 0 auto;display:block;background:var(--soft)}
.avatar.ini{display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;
  font-weight:700;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line)}
.avatar-wrap{position:relative;cursor:pointer;flex:0 0 auto;display:block}
.avatar-edit{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:10px;font-weight:700;
  background:rgba(0,0,0,.55);color:#fff;border-radius:0 0 99px 99px;padding:3px 0 4px;opacity:0;transition:opacity .15s}
.avatar-wrap:hover .avatar-edit{opacity:1}
@media(hover:none){.avatar-edit{opacity:1}}
.prof-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.teamgrid{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:560px){.teamgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.teamgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1400px){.teamgrid{grid-template-columns:repeat(4,1fr)}}
.teamcard{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:9px 11px;cursor:pointer;text-align:left;color:inherit;font-family:inherit;min-width:0}
.teamcard:hover{border-color:var(--fg)}
.teamcard.off{opacity:.5}
.teamcard{width:100%}
.teamcard.sel{border-color:var(--fg);background:var(--soft);box-shadow:inset 3px 0 0 var(--fg)}
.tchev{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;opacity:.5}
.teamcard.sel .tchev{stroke:var(--fg);opacity:1}
.prof .psec:first-of-type{border-top:1px solid var(--line)}
.teamcard .tname{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teamcard .hint{font-size:11.5px}
.rankrow{display:inline-flex;gap:3px;align-items:center}
.rankrow .mark{fill:var(--line);stroke:none;flex:0 0 auto}
.rankrow .mark.on{fill:var(--amber)}
.mark-btn{border:0;background:none;padding:0 1px;cursor:pointer;line-height:0}
.ranksec{display:flex;align-items:center;gap:8px;margin:12px 0 6px}
.ranksec .lbl{font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap}
.ranksec .bar{flex:1;height:1px;background:var(--line)}
.ranksec:first-child{margin-top:0}
.calmonth{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calwd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.calcell{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;color:inherit}
.calcell.out{opacity:.35}
.calcell.hoy{border-color:var(--gold);border-width:2px}
.caln{font-weight:700;font-size:13px}
.caldot{font-size:10px;font-weight:700;background:var(--soft);color:var(--fg);border-radius:999px;padding:1px 6px;min-width:16px}
.caldot.warn{background:var(--red-soft);color:var(--red)}
.wkgrid{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:560px){.wkgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.wkgrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1240px){.wkgrid{grid-template-columns:repeat(7,1fr)}}
.wkday{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 9px 8px;min-width:0;display:flex;flex-direction:column}
.wkday.fin{background:var(--soft)}
.wkday.hoy{border-color:var(--fg);box-shadow:inset 0 3px 0 var(--fg)}
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.wkhead b{font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:14.5px}
.wkhead .tag{font-size:10px;padding:1px 5px}
.wkstats{display:flex;gap:7px;flex-wrap:wrap;margin:3px 0 6px}
.wkstats .hint{font-size:11px}
.wkwarn{background:var(--red-soft);color:var(--red);border-radius:7px;padding:2px 7px;font-size:11px;font-weight:700;margin-bottom:6px;text-align:center}
.wklist{display:flex;flex-direction:column;gap:5px}
.wkitem{display:flex;gap:6px;background:var(--soft);border-radius:8px;padding:5px 7px;cursor:pointer;border-left:3px solid var(--green)}
.wkday.fin .wkitem{background:var(--card)}
.wkitem.pending{border-left-color:var(--red)}
.wkitem.credit{border-left-color:var(--blue)}
.wkitem.stay{border-left-color:var(--amber);opacity:.75}
.wkt{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;color:var(--muted);flex:0 0 auto;padding-top:1px}
.wkn{font-size:12.5px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wks{font-size:11px;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankbar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.rankbar span{display:block;height:100%;background:var(--amber);border-radius:3px;min-width:2px}
.prof .prof-head{gap:11px}
.prof-name{font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.04em;
  font-weight:700;font-size:21px;padding:2px 5px;border-color:transparent;background:transparent;width:100%}
.pstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
@media(min-width:520px){.pstats{grid-template-columns:repeat(4,1fr)}}
.pstats > div{background:var(--soft);border-radius:10px;padding:7px 9px;min-width:0}
.pstats b{display:block;font-family:'Montserrat',sans-serif;font-weight:700;font-size:19px;line-height:1.1;margin-top:1px}
.pstats .hint{font-size:11px}
.pstats .eyebrow{font-size:10px;letter-spacing:.06em}
.psec{border-top:1px solid var(--line)}
.psec-h{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;
  padding:10px 2px;color:inherit;text-align:left}
.psec-h .lbl{font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.08em;
  font-weight:700;font-size:14px;flex:1;min-width:0}
.psec-h .hint{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.psec-h .chev{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;
  flex:0 0 auto;transition:transform .15s}
.psec.on .psec-h .chev{transform:rotate(180deg)}
.psec-b{padding:0 2px 12px}
.pill.sm{padding:3px 9px;font-size:11.5px}
@media(min-width:1000px){ .eqgrid{grid-template-columns:minmax(0,0.95fr) minmax(0,1.05fr)} }
.eqgrid .teamgrid{grid-template-columns:1fr}
@media(min-width:640px){.eqgrid .teamgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.eqgrid .teamgrid{grid-template-columns:1fr}}
@media(min-width:1300px){.eqgrid .teamgrid{grid-template-columns:repeat(2,1fr)}}
.starpick{display:inline-flex;gap:2px}
.starpick button{border:0;background:none;cursor:pointer;font-size:22px;line-height:1;padding:0 1px;color:var(--muted)}
.starpick button.on{color:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- day rail ---------- */
.hourrow{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.hourrow:first-child{border-top:0}
.hour{
  width:58px;flex:0 0 auto;font-family:'Montserrat',sans-serif;font-weight:700;
  letter-spacing:.05em;font-size:14px;color:var(--muted);padding-top:2px;
}
.hour.live{color:var(--red)}
.hour .tideh{font-family:'Montserrat',sans-serif;font-weight:500;font-size:10.5px;letter-spacing:0;opacity:.75;margin-top:1px}
.slot{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.slotitem{
  display:flex;gap:8px;align-items:center;background:var(--soft);
  border-radius:9px;padding:7px 9px;cursor:pointer;border-left:3px solid var(--fg);
}
.slotitem.pending{border-left-color:var(--red)}
.slotitem.credit{border-left-color:var(--blue)}
.slotitem .who{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotitem .svc{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- stats ---------- */
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat .n{font-family:'Montserrat',sans-serif;font-weight:700;font-size:25px;line-height:1.1;letter-spacing:.01em}
.stat .n.green{color:var(--green)} .stat .n.red{color:var(--red)} .stat .n.blue{color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stats.s3{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.stats.s3{grid-template-columns:repeat(3,1fr)}}
.stats.s2{grid-template-columns:repeat(2,1fr)}
.stat .n .sub{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-top:1px;letter-spacing:.02em}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{
  text-align:left;font-family:'Montserrat',sans-serif;text-transform:uppercase;
  letter-spacing:.09em;font-size:12px;color:var(--muted);font-weight:600;
  padding:5px 6px;border-bottom:1px solid var(--line);
}
table.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl td.r,table.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tr:last-child td{border-bottom:0}

/* ---------- sheet / modal ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(6,6,8,.55);display:none;backdrop-filter:blur(2px)}
.overlay.open{display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--bg);width:100%;max-height:94vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:0 0 40px;-webkit-overflow-scrolling:touch;
}
.sheet-head{
  position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 10px;
  border-bottom:1px solid var(--line);
}
.sheet-body{padding:12px 14px 0}
@media(min-width:760px){
  .overlay.open{align-items:center;padding:24px}
  .sheet{max-width:760px;border-radius:16px;max-height:88vh;border:1px solid var(--line)}
}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 10px}

   app funcione sin señal en la playa, pero la fuente de verdad es Supabase.

  const b=document.getElementById('syncBadge'); if(!b) return;
  b.classList.remove('ok','busy','err');
  if(state) b.classList.add(state);
  document.getElementById('syncBadgeTxt').textContent = txt;

async function cloudLogin(){
  const email = document.getElementById('cloudEmail').value.trim();
  const pass = document.getElementById('cloudPass').value;
  const msg = document.getElementById('cloudMsg');
  msg.textContent = '';
  if(!email || !pass){ msg.textContent = 'Completá correo y contraseña'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ msg.textContent = 'No se pudo entrar: ' + error.message; return; }
  document.getElementById('cloudLogin').style.display = 'none';
  startApp();

const PENDING_KEY = KEY+'-pending';
function markPending(v){ try{ if(v) localStorage.setItem(PENDING_KEY,'1'); else localStorage.removeItem(PENDING_KEY); }catch(e){} }
function hasPending(){ try{ return localStorage.getItem(PENDING_KEY)==='1'; }catch(e){ return false; } }

let cloudSaveTimer = null;
function cloudSave(){
  clearTimeout(cloudSaveTimer);
  setSyncBadge('busy','Guardando…');
  cloudSaveTimer = setTimeout(async ()=>{
    try{
      const { error } = await sb.from('divine_circle_data')
        .upsert({ id: CLOUD_ROW_ID, data: DB, updated_at: new Date().toISOString() });
      if(error) throw error;
      markPending(false);
      DB.settings.lastBackup = new Date().toLocaleString('es-CR');
      const hhmm = new Date().toLocaleTimeString('es-CR', {hour:'2-digit', minute:'2-digit'});
      setSyncBadge('ok','Respaldado ✓ '+hhmm);
      maybeSnapshotBackup();
    }catch(err){
      markPending(true);
      setSyncBadge('err','Sin conexión — guardado local');
    }
  }, 1000);
}

/* al volver la conexión, reintenta subir sola sin esperar a que edites algo más */
window.addEventListener('online', ()=>{ if(hasPending()) cloudSave(); });

/* copia de seguridad con historial: como mucho una por hora, se conservan las últimas 30 */
let lastSnapshotAt = 0;
async function maybeSnapshotBackup(){
  const now = Date.now();
  if(now - lastSnapshotAt < 3600000) return;
  lastSnapshotAt = now;
  try{
    await sb.from('divine_circle_backups').insert({ data: DB });
    const { data: old } = await sb.from('divine_circle_backups').select('id').order('id',{ascending:false}).range(30,10000);
    if(old && old.length) await sb.from('divine_circle_backups').delete().in('id', old.map(r=>r.id));
  }catch(err){ /* si falla el respaldo de historial, no interrumpe el uso normal */ }
}

async function cloudLoad(){
  try{
    const { data, error } = await sb.from('divine_circle_data').select('data').eq('id', CLOUD_ROW_ID).maybeSingle();
    if(error) throw error;
    if(data && data.data){ setSyncBadge('ok','Respaldado ✓'); return data.data; }
    setSyncBadge('ok','Nuevo — sin datos aún en Supabase');
    return null;
  }catch(err){
    setSyncBadge('err','Sin conexión — usando copia local');
    return null;
  }

/* una reserva es de hotelería si tiene alojamiento, surfcamp, o fechas de entrada y salida */
function bookingFlow(b){
  return (b.items||[]).some(it=>it.cat==='stay'||it.cat==='camp'||it.dateOut) ? 'stay' : 'default';
}
const stagesOf = b => STAGE_SETS[bookingFlow(b)];
/* si cambia el tipo de reserva, la etapa se traduce al otro flujo */
const STAGE_MAP={encurso:'checkin', checkin:'encurso', hospedado:'encurso', checkout:'porcobrar'};
function normStage(b){
  const set=stagesOf(b);
  if(set.some(x=>x.id===b.stage)) return;
  const alt=STAGE_MAP[b.stage];
  b.stage = (alt && set.some(x=>x.id===alt)) ? alt : set[0].id;
}
function stageIdx(b){
  const set=stagesOf(b); let i=set.findIndex(x=>x.id===b.stage);
  if(i<0){ const alt=STAGE_MAP[b.stage]; i=set.findIndex(x=>x.id===alt); }
  return i<0?0:i;
}
/* desde qué etapa el dinero manda solo */

function load(){

/* ============================ deshacer / rehacer ============================
   Se guarda una foto de los datos ANTES de cada cambio. El parte de mar queda
   fuera a propósito: pesa mucho y no tiene sentido deshacerlo. */
const HIST_KEYS=['bookings','outs','catalog','instructors','sources','clients','settings'];
const HIST_MAX=60;
let undoStack=[], redoStack=[];
function snapshot(){ const o={}; HIST_KEYS.forEach(k=>o[k]=DB[k]); return JSON.stringify(o); }
function restoreSnap(json){ const o=JSON.parse(json); HIST_KEYS.forEach(k=>{ if(o[k]!==undefined) DB[k]=o[k]; }); }
function logAdd(label){
  DB.log=DB.log||[];
  DB.log.unshift({t:Date.now(), label});
  if(DB.log.length>300) DB.log.length=300;
}
function pushHistory(label){
  undoStack.push({label, data:snapshot()});
  if(undoStack.length>HIST_MAX) undoStack.shift();
  redoStack=[];
  logAdd(label);
}
function undo(){
  if(!undoStack.length){ toast('Nada que deshacer'); return; }
  const e=undoStack.pop();
  redoStack.push({label:e.label, data:snapshot()});
  restoreSnap(e.data);
  logAdd('↶ Deshecho: '+e.label);
  save(); applyTheme(); closeSheet(); render();
  toast('Deshecho · '+e.label);
}
function redo(){
  if(!redoStack.length){ toast('Nada que rehacer'); return; }
  const e=redoStack.pop();
  undoStack.push({label:e.label, data:snapshot()});
  restoreSnap(e.data);
  logAdd('↷ Rehecho: '+e.label);
  save(); applyTheme(); closeSheet(); render();
  toast('Rehecho · '+e.label);
}

/* ============================ COPIAS DE SEGURIDAD ============================
   Los datos viven en este navegador. Para que un borrado accidental o un
   navegador que limpia su almacenamiento no se lleve todo, la app guarda
   copias automáticas aparte y avisa cuando hace mucho que no bajás un respaldo. */
const AUTO_KEY = KEY+'-auto';
const AUTO_MAX = 4;
function autoList(){
  try{ const a=JSON.parse(localStorage.getItem(AUTO_KEY)||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function autoSave(force){
  try{
    const list=autoList();
    const hoy=today();
    if(!force && list.some(x=>x.day===hoy)) return;
    const data=snapshot();
    const entry={day:hoy, t:Date.now(), size:data.length, data};
    const next=[entry, ...list.filter(x=>x.day!==hoy)].slice(0,AUTO_MAX);
    /* si pesa mucho, se van soltando las más viejas */
    while(next.length>1 && next.reduce((s,x)=>s+x.size,0) > 1600000) next.pop();
    localStorage.setItem(AUTO_KEY, JSON.stringify(next));
  }catch(e){ /* almacenamiento lleno: seguimos sin copia */ }
}
function autoRestore(day){
  const e=autoList().find(x=>x.day===day); if(!e) return;
  if(!confirm('Volver a la copia del '+fmtDate(day)+'. Lo que hay ahora se reemplaza. ¿Seguir?')) return;
  pushHistory('Volver a la copia del '+fmtDate(day));
  restoreSnap(e.data); save(); applyTheme(); render();
  toast('Restaurado al '+fmtDate(day));
}

/* choques: la misma tabla rentada dos veces el mismo día en horarios que se pisan */
function boardClashes(){
  const porTabla=new Map();
  DB.bookings.forEach(bk=>(bk.items||[]).forEach(it=>{
    if(it.cat!=='rental' || !it.boardId) return;
    const d=it.date||bk.date; if(!d) return;
    const k=it.boardId+'|'+d;
    if(!porTabla.has(k)) porTabla.set(k,[]);
    const h=Number(String(it.time||'09:00').slice(0,2))+Number(String(it.time||'09:00').slice(3,5))/60;
    porTabla.get(k).push({bk,it,ini:h,fin:h+(Number(it.hours)||2)});
  }));
  const out=[];
  porTabla.forEach((arr,k)=>{
    if(arr.length<2) return;
    arr.sort((a,b)=>a.ini-b.ini);
    for(let i=1;i<arr.length;i++)
      if(arr[i].ini < arr[i-1].fin - 0.01) out.push({boardId:k.split('|')[0], date:k.split('|')[1], a:arr[i-1], b:arr[i]});
  });
  return out;
}

function slotCandidates(slot){
  return DB.instructors.filter(i=> i.active!==false
    && (i.stars||1) >= (slot.minStars||1)
    && (!(slot.langs||[]).length || (slot.langs||[]).every(l=>(i.langs||[]).includes(l)))
    && (!(slot.tags||[]).length  || (slot.tags||[]).every(t=>(i.tags||[]).includes(t))) );
}
function slotReq(slot){
  const p=[];
  if(slot.minStars>1) p.push(rankName(slot.minStars)+'+');
  (slot.langs||[]).forEach(l=>p.push(langName(l)));
  (slot.tags||[]).forEach(t=>p.push(t));
  return p.join(' · ') || 'sin requisitos';
}
function findSlot(bid,iid,sid){
  const [b,it]=findItem(bid,iid); if(!it) return [null,null,null];
  return [b,it,(it.assigns||[]).find(x=>x.id===sid)];
}
/* respuesta de un instructor: 'si' o 'no' */
function answerSlot(bid,iid,sid,instructorId,ans){
  const [b,it,slot]=findSlot(bid,iid,sid); if(!slot) return;
  const ins=instr(instructorId); if(!ins) return;
  slot.offers=slot.offers||[];
  const prev=slot.offers.find(o=>o.iid===instructorId);
  if(prev){ prev.answer=ans; prev.at=Date.now(); }
  else slot.offers.push({iid:instructorId, name:ins.name, answer:ans, at:Date.now()});

  if(ans==='si'){
    const eraSuyo = slot.instructorId===instructorId;
    if(eraSuyo || slot.status==='abierto'){
      if(eraSuyo || DB.settings.autoAssign){
        slot.instructorId=instructorId; slot.name=ins.name; slot.status='confirmado';
        logAdd('Confirmó '+ins.name+' · '+it.name+' '+(it.time||''));
        toast(ins.name+' confirmado');
      } else {
        logAdd(ins.name+' se ofreció · '+it.name);
        toast(ins.name+' se ofreció — elegí quién va');
      }
    }
  } else {
    if(slot.instructorId===instructorId){
      slot.instructorId=''; slot.name=''; slot.status='abierto';
      const n=slotCandidates(slot).filter(x=>x.id!==instructorId).length;
      logAdd(ins.name+' no puede · convocatoria abierta a '+n+' instructores');
      toast(ins.name+' no puede — se abrió a '+n+' instructores');
    } else {
      logAdd(ins.name+' no puede · '+it.name);
    }
  }
  save();
}

const esc0 = v => String(v==null?'':v);

/* -------- estadías: noches entre entrada y salida -------- */
function nights(it){
  if(!it.dateOut || !it.date) return 1;
  const a=new Date(it.date+'T00:00'), b=new Date(it.dateOut+'T00:00');
  const d=Math.round((b-a)/86400000);
  return d>0?d:1;
}
/* -------- rentas: duración y vencimiento -------- */
function parseHours(name){
  const n=String(name||'').toUpperCase();
  if(/WEEK/.test(n)) return 24*7;
  if(/\bDAY\b/.test(n)) return 8;
  const m=n.match(/(\d+)\s*H\b/);
  return m?Number(m[1]):0;
}
function rentalDue(it){
  if(!it.hours || !it.date) return null;
  const d=new Date(it.date+'T'+(it.time||'09:00'));
  if(isNaN(d)) return null;
  return new Date(d.getTime()+it.hours*3600000);
}
function shortSpan(ms){
  const m=Math.round(ms/60000);
  if(m<60) return m+' min';
  const h=Math.floor(m/60);
  if(h<24) return h+'h'+(m%60?' '+(m%60)+'m':'');
  return Math.round(h/24)+' d';
}
function hhmm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function rentalStatus(it){
  if(it.cat!=='rental') return null;
  if(it.returned) return {k:'ok', label:'Devuelta'};
  const due=rentalDue(it);
  if(!due) return {k:'out', label:'Marcar devuelta'};
  const ms=due-Date.now();
  if(ms<0)          return {k:'late', label:'Vencida hace '+shortSpan(-ms)};
  if(ms<45*60000)   return {k:'soon', label:'Vence en '+shortSpan(ms)};
  return {k:'out', label:'Devolver '+hhmm(due)};
}

/* -------- cálculo de dinero -------- */
function lineTotal(it){
  const mult = it.perNight ? nights(it) : 1;
  const base = (Number(it.price)||0) * (Number(it.qty)||1) * mult;
  const d = Number(it.disc)||0;
  return n2(Math.max(0, base - d));
}
function bookingTotals(b){
  let total=0, cobrado=0, pendiente=0, credito=0, costo=0, costoPagado=0, pax=0;
  (b.items||[]).forEach(it=>{
    const t = lineTotal(it);
    total += t; pax += Number(it.qty)||0;
    if(it.pay==='paid') cobrado += t;
    else if(it.pay==='credit') credito += t;
    else pendiente += t;
    crewFilled(it).forEach(a=>{ costo += Number(a.amount)||0; if(a.paid) costoPagado += Number(a.amount)||0; });
  });
  const src = DB.sources.find(s=>s.name===b.source);
  const comi = src && src.comi ? n2(total*src.comi/100) : 0;
  return {total:n2(total),cobrado:n2(cobrado),pendiente:n2(pendiente),credito:n2(credito),
          costo:n2(costo),costoPagado:n2(costoPagado),costoPend:n2(costo-costoPagado),
          comi, pax, neto:n2(total-costo-comi)};
}
function inRange(iso, from, to){ if(!iso) return false; return iso>=from && iso<=to; }
function periodRange(p){
  const t = new Date(); const iso = d => d.toISOString().slice(0,10);
  if(p==='hoy') return [today(),today()];
  if(p==='semana'){ const d=new Date(t); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); const e=new Date(d); e.setDate(e.getDate()+6); return [iso(d),iso(e)]; }
  if(p==='mes'){ const d=new Date(t.getFullYear(),t.getMonth(),1), e=new Date(t.getFullYear(),t.getMonth()+1,0); return [iso(d),iso(e)]; }
  if(p==='año'){ return [t.getFullYear()+'-01-01', t.getFullYear()+'-12-31']; }
  return ['1900-01-01','2999-12-31'];
}

    return `<button class="subbtn ${c.id===TAB?'on':''}" data-subtab="${c.id}">${lab}</button>`;
  }).join('');

  DB.bookings.forEach(b=>(b.items||[]).forEach(it=>{

  return out.sort((a,x)=>String(a.it.time||'99').localeCompare(String(x.it.time||'99')));

/* ==================== VISTAS DE ÁREA (lecciones/rentas/reservas/ventas) ==================== */
function stageLabel(bk,i){ const set=stagesOf(bk); return (set[i]||set[0]).s; }
/* Si el ticket ya arrancó (En curso o más), la etapa sigue sola al dinero:
   queda algo sin cobrar -> Por cobrar; se cobra todo -> Lista. */
function autoStage(b){
  if(!b || !(b.items||[]).length) return;
  normStage(b);
  const i = stageIdx(b);
  if(i < moneyFrom(b)) return;
  const pend = bookingTotals(b).pendiente > 0;
  if(pend) b.stage='porcobrar';
  else if(b.stage==='porcobrar') b.stage='lista';
}
function railHTML(bk,small){
  const si=stageIdx(bk);
  return `<div class="rail" ${small?'style="margin-top:8px"':''}>${stagesOf(bk).map((st,i)=>{
    const cur=i===si, lab=stageLabel(bk,i);
    const due = cur && st.id==='porcobrar';
    return `<button data-act="stage" data-id="${bk.id}" data-v="${st.id}" class="${i<si?'done':''}${cur?' cur':''}${due?' due':''}">${lab}</button>`;
  }).join('')}</div>`;
}

function clientList(){
  const m=new Map();
  DB.bookings.forEach(b=>{
    const name=(b.client||'').trim(); if(!name) return;
    const key=name.toLowerCase();
    const c=m.get(key)||{name,visitas:0,total:0,pendiente:0,ultima:'',bookings:[]};
    c.visitas++; c.bookings.push(b);
    (b.items||[]).forEach(it=>{ c.total+=lineTotal(it); if(it.pay!=='paid') c.pendiente+=lineTotal(it); });
    if(!c.ultima || b.date>c.ultima) c.ultima=b.date;
    m.set(key,c);
  });
  return [...m.values()].sort((a,b)=>b.ultima.localeCompare(a.ultima));
}

function instructorLedger(){
  const m=new Map();
  DB.instructors.forEach(i=>m.set(i.name,{name:i.name,phone:i.phone,clases:0,pax:0,total:0,pagado:0,pend:0,rows:[]}));
  DB.bookings.forEach(b=>(b.items||[]).forEach(it=>crewFilled(it).forEach(a=>{
    const c=m.get(a.name)||{name:a.name,phone:'',clases:0,pax:0,total:0,pagado:0,pend:0,rows:[]};
    c.clases++; c.pax+=Number(it.qty)||0; c.total+=Number(a.amount)||0;
    if(a.paid) c.pagado+=Number(a.amount)||0; else c.pend+=Number(a.amount)||0;
    c.rows.push({date:it.date||b.date,name:it.name,client:b.client,amount:Number(a.amount)||0,paid:!!a.paid,bid:b.id,iid:it.id,aid:a.id});
    m.set(a.name,c);
  })));
  return [...m.values()].filter(c=>c.clases>0).sort((a,b)=>b.pend-a.pend||b.total-a.total);
}
/* ============================ PERFIL DE INSTRUCTOR ============================ */
function instrStats(id, from, to){
  const ins=instr(id); if(!ins) return null;
  const st={clases:0, pax:0, generado:0, aPagar:0, pagado:0, pend:0,
            porServicio:new Map(), porMes:new Map(), rows:[], playas:new Map(), primera:null, ultima:null};
  DB.bookings.forEach(b=>(b.items||[]).forEach(it=>{
    const crew=crewFilled(it);
    const mine=crew.find(a=>a.instructorId===id);
    if(!mine) return;
    const d=it.date||b.date;
    if(from && !(d>=from && d<=to)) return;
    const parte = crew.length ? lineTotal(it)/crew.length : lineTotal(it);
    st.clases++; st.pax += Number(it.qty)||0; st.generado += parte;
    st.aPagar += Number(mine.amount)||0;
    if(mine.paid) st.pagado += Number(mine.amount)||0; else st.pend += Number(mine.amount)||0;
    const sv=st.porServicio.get(it.name)||{n:0,pax:0,$:0};
    sv.n++; sv.pax+=Number(it.qty)||0; sv.$+=Number(mine.amount)||0; st.porServicio.set(it.name,sv);
    const mes=(d||'').slice(0,7);
    const mm=st.porMes.get(mes)||{n:0,$:0}; mm.n++; mm.$+=Number(mine.amount)||0; st.porMes.set(mes,mm);
    if(it.beach){ st.playas.set(it.beach,(st.playas.get(it.beach)||0)+1); }
    st.rows.push({date:d, time:it.time, name:it.name, client:b.client, qty:it.qty,
                  amount:Number(mine.amount)||0, paid:!!mine.paid, role:mine.role,
                  bid:b.id, iid:it.id, aid:mine.id});
    if(!st.primera || d<st.primera) st.primera=d;
    if(!st.ultima || d>st.ultima) st.ultima=d;
  }));
  st.rows.sort((a,b)=>String(b.date+(b.time||'')).localeCompare(String(a.date+(a.time||''))));
  return st;
}

/* todos los puestos sin cubrir, ordenados por fecha */
function openCalls(){
  const out=[];
  DB.bookings.forEach(b=>(b.items||[]).forEach(it=>{
    crewOpen(it).forEach(sl=>out.push({b,it,sl,date:it.date||b.date}));
  }));
  return out.sort((a,x)=>String(a.date+(a.it.time||'')).localeCompare(String(x.date+(x.it.time||''))));
}
function callCard(o, asIns){
  const {b,it,sl}=o;
  const k=condAt(o.date, it.time);
  const cands=slotCandidates(sl);
  const mine=asIns && cands.some(i=>i.id===asIns) && (!sl.instructorId || sl.instructorId===asIns);
  const my=(sl.offers||[]).find(x=>x.iid===asIns);
  const sis=(sl.offers||[]).filter(x=>x.answer==='si');
  return `<div class="line" style="background:var(--card)">
    <div class="between" style="align-items:flex-start">
      <div style="min-width:0">
        <b>${fmtDate(o.date)}${it.time?' · '+esc(it.time):''} · ${esc(it.name)}</b>
        <div class="hint">${esc(b.client||'')} · ${it.qty} pax${it.level?' · '+esc(it.level):''}${it.beach?' · '+esc(it.beach):''}</div>
      </div>
      <div style="text-align:right;flex:0 0 auto">
        <div class="mono" style="font-weight:700">${money(sl.amount)}</div>
        <div class="hint">${esc(sl.role||'Puesto')}</div>
      </div>
    </div>
    <div class="row" style="gap:5px;flex-wrap:wrap;margin-top:7px">
      <span class="tag">${esc(slotReq(sl))}</span>
      ${sl.instructorId?`<span class="tag amber">pedido a ${esc(sl.name)}</span>`:`<span class="tag">${cands.length} pueden tomarlo</span>`}
      ${sis.length?`<span class="tag green">${sis.length} dijo${sis.length>1?'n':''} que puede${sis.length>1?'n':''}</span>`:''}
      ${k?`<span class="sparkbox tag" style="padding:1px 7px 1px 8px">marea ${k.tide.toFixed(1)} m ${k.rising?'↑':'↓'}${tideSparkAt(o.date, it.time, 52, 20)}</span>`:''}
      ${k&&k.sr?`<span class="tag blue">${k.sr.lo.toFixed(1)}–${k.sr.hi.toFixed(1)} m</span>`:''}
      ${k&&k.m.wind!==null?`<span class="tag ${k.wk?k.wk.tag:''}">${Math.round(k.m.wind)} kt ${k.wk?k.wk.label:''}</span>`:''}
    </div>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:9px">
      ${mine?`
        <button class="btn xs ${my&&my.answer==='si'?'':'ghost'}" data-act="answer" data-v="si"
          data-id="${b.id}" data-item="${it.id}" data-asg="${sl.id}" data-who="${asIns}">${my&&my.answer==='si'?'✓ Dijiste que podés':'🙋 Yo puedo'}</button>
        <button class="btn xs ${my&&my.answer==='no'?'danger':'ghost'}" data-act="answer" data-v="no"
          data-id="${b.id}" data-item="${it.id}" data-asg="${sl.id}" data-who="${asIns}">No puedo</button>`
        : (asIns?`<span class="hint">No cumplís el requisito de este puesto.</span>`:'')}
      <button class="btn xs ghost" data-act="slot-edit" data-id="${b.id}" data-item="${it.id}" data-asg="${sl.id}" style="margin-left:auto">Gestionar</button>
      <button class="btn xs ghost" data-act="crew-copy" data-id="${b.id}" data-item="${it.id}">Copiar</button>
    </div>
  </div>`;
}

function viewEquipo(){
  const sel = UI.profile && instr(UI.profile) ? UI.profile : null;
  const [f,t]=periodRange(UI.eperiod||'mes');
  const todo=(UI.eperiod||'mes')==='todo';
  /* totales del periodo sobre las clases asignadas */
  let clases=0, pax=0, aPagar=0, pagado=0, pend=0, abiertos=0, sinCubrir=0;
  const porRol=new Map();
  DB.bookings.forEach(b=>(b.items||[]).forEach(it=>{
    const d=it.date||b.date;
    if(!todo && !inRange(d,f,t)) return;
    if(needsCrew(it) && !crewFilled(it).length) sinCubrir++;
    crewOpen(it).forEach(()=>abiertos++);
    crewFilled(it).forEach(a=>{
      clases++; pax+=Number(it.qty)||0;
      aPagar+=Number(a.amount)||0;
      if(a.paid) pagado+=Number(a.amount)||0; else pend+=Number(a.amount)||0;
      const r=a.role||'Puesto'; const c=porRol.get(r)||{n:0,$:0}; c.n++; c.$+=Number(a.amount)||0; porRol.set(r,c);
    });
  }));
  const activos=DB.instructors.filter(i=>i.active!==false);
  const led=instructorLedger();
  const top=led.slice().sort((a,b)=>b.clases-a.clases).slice(0,6);

  /* la lista de la derecha, agrupada por rango */

  return `

function weekStart(off){

}

  const modeSwitch=`<div class="chiprow" style="margin-bottom:12px">
    ${[['dia','Día'],['semana','Semana'],['mes','Mes']].map(([k,l])=>
      `<button class="chip ${mode===k?'on':''}" data-act="calmode" data-v="${k}">${l}</button>`).join('')}
  </div>`;
  if(mode==='dia') return modeSwitch+viewCalDia();
  if(mode==='mes') return modeSwitch+viewCalMes();
  return modeSwitch+viewCalSemana();
}
function viewCalDia(){
  const iso=UI.calDate||today();
  const d=new Date(iso+'T00:00:00');
  const rows=[];
  DB.bookings.forEach(b=>(b.items||[]).forEach(it=>{ if((it.date||b.date)===iso) rows.push({b,it}); }));
  rows.sort((a,x)=>String(a.it.time||'99').localeCompare(String(x.it.time||'99')));
  let pax=0,cob=0,pend=0,abiertos=0;
  rows.forEach(({it})=>{
    pax+=Number(it.qty)||0; const v=lineTotal(it);
    if(it.pay==='paid') cob+=v; else if(it.pay!=='credit') pend+=v;
    abiertos+=crewOpen(it).length;
  });
  const prev=new Date(d); prev.setDate(prev.getDate()-1);
  const next=new Date(d); next.setDate(next.getDate()+1);
  return `
  <div class="between" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">
    <div class="row" style="gap:6px">
      <button class="btn sm ghost" data-act="calday" data-v="${prev.toISOString().slice(0,10)}">←</button>
      <button class="btn sm ${iso===today()?'':'ghost'}" data-act="calday" data-v="${today()}">${iso===today()?'Hoy':'Ir a hoy'}</button>
      <button class="btn sm ghost" data-act="calday" data-v="${next.toISOString().slice(0,10)}">→</button>
      <span class="eyebrow" style="align-self:center;margin-left:4px">${DIAS_C[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}</span>
    </div>
    <div class="row" style="gap:6px;flex-wrap:wrap">
      <span class="tag">${rows.length} servicios</span>
      <span class="tag">${pax} pax</span>
      <span class="tag green">${money(cob)}</span>
      ${pend?`<span class="tag red">${money(pend)} por cobrar</span>`:''}
      ${abiertos?`<span class="tag red">${abiertos} sin cubrir</span>`:''}
    </div>
  </div>
  <div class="card">
    ${rows.length ? rows.map(({b,it})=>{
      const crew=crewFilled(it), open=crewOpen(it).length, st=it.pay||'pending';
      const stLabel=st==='paid'?'Pagado':st==='credit'?'Crédito':'Pendiente';
      const stBg=st==='paid'?'var(--green-soft)':st==='credit'?'var(--amber-soft)':'var(--red-soft)';
      const stFg=st==='paid'?'var(--green)':st==='credit'?'var(--amber)':'var(--red)';
      return `<div class="slotitem" data-act="open-booking" data-id="${b.id}" style="cursor:pointer">
        <div style="width:48px;flex:0 0 auto;font-weight:700;font-size:12px;color:var(--muted)">${esc(it.time||'--:--')}</div>
        <div style="min-width:0;flex:1">
          <div class="who">${esc(b.client||'Sin nombre')}${it.qty>1?` <span class="muted">·${it.qty}</span>`:''}</div>
          <div class="svc">${esc(it.name)}${crew.length?' · '+crew.map(a=>esc(a.name.split(' ')[0])).join(', '):(open?` · <b style="color:var(--red)">${open} sin cubrir</b>`:'')}</div>
        </div>
        <span class="tag" style="background:${stBg};color:${stFg}">${stLabel}</span>
      </div>`;
    }).join('') : `<div class="hint" style="padding:14px 0;text-align:center">Nada agendado este día</div>`}
  </div>
  <button class="btn" style="margin-top:12px;width:100%" data-act="wk-new" data-v="${iso}">+ Agregar este día</button>`;
}
function viewCalMes(){
  const off=UI.moOff||0;
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+off);
  const year=base.getFullYear(), month=base.getMonth();
  const first=new Date(year,month,1);
  const startOffset=(first.getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<startOffset;i++){ const d=new Date(year,month,1-(startOffset-i)); cells.push({d,out:true}); }
  for(let day=1;day<=daysInMonth;day++){ cells.push({d:new Date(year,month,day),out:false}); }
  while(cells.length%7!==0){ const last=cells[cells.length-1].d; const d=new Date(last); d.setDate(d.getDate()+1); cells.push({d,out:true}); }
  cells.forEach(c=>{
    c.iso=c.d.toISOString().slice(0,10);
    let n=0, abiertos=0;
    DB.bookings.forEach(b=>(b.items||[]).forEach(it=>{
      if((it.date||b.date)!==c.iso) return;
      n++; abiertos+=crewOpen(it).length;
    }));
    c.n=n; c.abiertos=abiertos; c.hoy=c.iso===today();
  });
  return `
  <div class="between" style="margin-bottom:10px">
    <div class="row" style="gap:6px">
      <button class="btn sm ghost" data-act="mo" data-v="${off-1}">←</button>
      <button class="btn sm ${off===0?'':'ghost'}" data-act="mo" data-v="0">${off===0?'Este mes':'Hoy'}</button>
      <button class="btn sm ghost" data-act="mo" data-v="${off+1}">→</button>
    </div>
    <span class="eyebrow">${MESES[month]} ${year}</span>
  </div>
  <div class="calmonth">
    ${['L','M','X','J','V','S','D'].map(d=>`<div class="calwd">${d}</div>`).join('')}
    ${cells.map(c=>`<button class="calcell ${c.out?'out':''} ${c.hoy?'hoy':''}" data-act="mes-day" data-v="${c.iso}">
      <span class="caln">${c.d.getDate()}</span>
      ${c.n?`<span class="caldot ${c.abiertos?'warn':''}">${c.n}</span>`:''}
    </button>`).join('')}
  </div>`;
}
function viewCalSemana(){
  const off=UI.wkOff||0;
  const d0=weekStart(off);
  const dias=[];
  for(let k=0;k<7;k++){
    const d=new Date(d0); d.setDate(d.getDate()+k);
    const iso=d.toISOString().slice(0,10);
    const rows=[];
    DB.bookings.forEach(b=>(b.items||[]).forEach(it=>{
      if((it.date||b.date)===iso) rows.push({b,it});
    }));
    rows.sort((a,x)=>String(a.it.time||'99').localeCompare(String(x.it.time||'99')));
    /* estadías: cuentan los días intermedios */
    const enCasa=[];
    DB.bookings.forEach(b=>(b.items||[]).forEach(it=>{
      if(!it.dateOut) return;
      const de=it.date||b.date;
      if(iso>de && iso<it.dateOut) enCasa.push({b,it});
    }));
    let cob=0, pend=0, pax=0, abiertos=0, sinNadie=0;
    rows.forEach(({it})=>{
      const v=lineTotal(it); pax+=Number(it.qty)||0;
      if(it.pay==='paid') cob+=v; else if(it.pay!=='credit') pend+=v;
      abiertos+=crewOpen(it).length;
      if(needsCrew(it) && !crewFilled(it).length) sinNadie++;
    });
    dias.push({d,iso,rows,enCasa,cob,pend,pax,abiertos,sinNadie,
      hoy:iso===today(), fin:d.getDay()===0||d.getDay()===6});
  }
  const tot={cob:0,pend:0,pax:0,abiertos:0,n:0};
  dias.forEach(x=>{ tot.cob+=x.cob; tot.pend+=x.pend; tot.pax+=x.pax; tot.abiertos+=x.abiertos; tot.n+=x.rows.length; });
  const fin=new Date(d0); fin.setDate(fin.getDate()+6);
  const rango=`${d0.getDate()} ${MESES[d0.getMonth()]} – ${fin.getDate()} ${MESES[fin.getMonth()]}`;

  /* quién trabaja esta semana */
  const porIns=new Map();
  dias.forEach(x=>x.rows.forEach(({it})=>crewFilled(it).forEach(a=>{
    const c=porIns.get(a.name)||{n:0,$:0,dias:new Set()};
    c.n++; c.$+=Number(a.amount)||0; c.dias.add(x.iso); porIns.set(a.name,c);
  })));

  return `
  <div class="between" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">
    <div class="row" style="gap:6px">
      <button class="btn sm ghost" data-act="wk" data-v="${off-1}">←</button>
      <button class="btn sm ${off===0?'':'ghost'}" data-act="wk" data-v="0">${off===0?'Esta semana':'Hoy'}</button>
      <button class="btn sm ghost" data-act="wk" data-v="${off+1}">→</button>
      <span class="eyebrow" style="align-self:center;margin-left:4px">${rango}</span>
    </div>
    <div class="row" style="gap:6px;flex-wrap:wrap">
      <span class="tag">${tot.n} servicios</span>
      <span class="tag">${tot.pax} pax</span>
      <span class="tag green">${money(tot.cob)}</span>
      ${tot.pend?`<span class="tag red">${money(tot.pend)} por cobrar</span>`:''}
      ${tot.abiertos?`<span class="tag red">${tot.abiertos} puestos sin cubrir</span>`:''}
    </div>
  </div>

  <div class="wkgrid">
    ${dias.map(x=>`
      <div class="wkday ${x.hoy?'hoy':''} ${x.fin?'fin':''}">
        <div class="wkhead">
          <div><b>${DIAS_C[x.d.getDay()]} ${x.d.getDate()}</b>${x.hoy?' <span class="tag">hoy</span>':''}</div>
          <button class="btn xs ghost" data-act="wk-new" data-v="${x.iso}" title="Agregar ese día">+</button>
        </div>
        <div class="wkstats">
          <span class="hint">${x.rows.length?x.rows.length+' · '+x.pax+' pax':'—'}</span>
          ${x.cob?`<span class="hint" style="color:var(--green)">${money(x.cob)}</span>`:''}
          ${x.pend?`<span class="hint" style="color:var(--red)">${money(x.pend)}</span>`:''}
        </div>
        ${x.abiertos?`<div class="wkwarn">${x.abiertos} sin cubrir</div>`:''}
        <div class="wklist">
          ${x.rows.map(({b,it})=>{
            const crew=crewFilled(it), open=crewOpen(it).length;
            const st=it.pay||'pending';
            return `<div class="wkitem ${st}" data-act="open-booking" data-id="${b.id}" title="${esc(it.name)} · ${esc(b.client||'')}">
              <div class="wkt">${esc(it.time||'--:--')}</div>
              <div style="min-width:0;flex:1">
                <div class="wkn">${esc(b.client||'Sin nombre')}${it.qty>1?` <span class="muted">·${it.qty}</span>`:''}</div>
                <div class="wks">${esc(it.name)}</div>
                <div class="wks">${crew.length?crew.map(a=>esc(a.name.split(' ')[0])).join(', '):(open?`<b style="color:var(--red)">${open} sin cubrir</b>`:'')}</div>
              </div>
            </div>`;}).join('')}
          ${x.enCasa.map(({b,it})=>`<div class="wkitem stay" data-act="open-booking" data-id="${b.id}">
            <div class="wkt">···</div>
            <div style="min-width:0;flex:1"><div class="wkn">${esc(b.client||'')}</div>
              <div class="wks">hospedado · sale ${fmtDate(it.dateOut)}</div></div>
          </div>`).join('')}
          ${!x.rows.length&&!x.enCasa.length?'<div class="hint" style="padding:6px 2px">libre</div>':''}
        </div>
      </div>`).join('')}
  </div>

  <div class="grid g2" style="margin-top:12px">
    <div class="card">
      <div class="h2" style="margin-bottom:6px">Quién trabaja esta semana</div>
      ${porIns.size?`<table class="tbl"><tr><th>Instructor</th><th class="r">Días</th><th class="r">Clases</th><th class="r">₡</th></tr>
        ${[...porIns].sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r mono">${v.dias.size}</td><td class="r mono">${v.n}</td><td class="r mono">${money(v.$)}</td></tr>`).join('')}</table>`
        :'<div class="hint">Nadie asignado todavía en esta semana.</div>'}
    </div>
    <div class="card">
      <div class="h2" style="margin-bottom:6px">Carga por día</div>
      ${(()=>{const max=Math.max(1,...dias.map(x=>x.rows.length));
        return dias.map(x=>`<div style="margin-bottom:6px">
          <div class="between" style="margin-bottom:2px">
            <span class="hint" style="${x.hoy?'color:var(--fg);font-weight:700':''}">${DIAS_C[x.d.getDay()]} ${x.d.getDate()}</span>
            <span class="hint mono">${x.rows.length}${x.abiertos?` · <b style="color:var(--red)">${x.abiertos}</b>`:''}</span></div>
          <div class="rankbar"><span style="width:${Math.round(x.rows.length/max*100)}%;background:${x.abiertos?'var(--red)':'var(--fg)'}"></span></div>
        </div>`).join('');})()}
    </div>
  </div>`;
}

/* ============================ VISTA: TOTALES ============================ */
function viewTotales(){
  const [f,t]=periodRange(UI.period);
  const rows=[]; DB.bookings.forEach(b=>(b.items||[]).forEach(it=>{ if(inRange(it.date||b.date,f,t)) rows.push({b,it}); }));
  let total=0,cobrado=0,pend=0,credito=0,costo=0,costoPend=0,pax=0,comi=0;
  const byCat=new Map(), bySvc=new Map(), bySrc=new Map();
  const seenB=new Set();
  rows.forEach(({b,it})=>{
    const v=lineTotal(it); total+=v; pax+=Number(it.qty)||0;
    if(it.pay==='paid') cobrado+=v; else if(it.pay==='credit') credito+=v; else pend+=v;
    (it.assigns||[]).forEach(a=>{ costo+=Number(a.amount)||0; if(!a.paid) costoPend+=Number(a.amount)||0; });
    const c=byCat.get(it.cat)||{n:0,v:0}; c.n++; c.v+=v; byCat.set(it.cat,c);
    const s=bySvc.get(it.name)||{n:0,q:0,v:0}; s.n++; s.q+=Number(it.qty)||0; s.v+=v; bySvc.set(it.name,s);
    const k=b.source||'—'; const r=bySrc.get(k)||{n:0,v:0}; r.v+=v; bySrc.set(k,r);
    if(!seenB.has(b.id)){ seenB.add(b.id); r.n++; }
  });
  bySrc.forEach((v,k)=>{ const s=DB.sources.find(x=>x.name===k); if(s&&s.comi) comi+=v.v*s.comi/100; });
  const outs=DB.outs.filter(o=>inRange(o.date,f,t));
  const outTot=outs.reduce((s,o)=>s+(Number(o.amount)||0),0);
  /* los pagos a instructores ya están contados en "costo": no se suman de nuevo */
  const outOtros=outs.filter(o=>!o.linkAsg).reduce((s,o)=>s+(Number(o.amount)||0),0);
  const byOut=new Map(); outs.forEach(o=>{ const c=byOut.get(o.type)||0; byOut.set(o.type,c+(Number(o.amount)||0)); });
  const neto=cobrado-costo-comi-outOtros;
  return `
  ${periodChips()}
  <div class="stats">
    <div class="stat"><div class="eyebrow">Facturado</div><div class="n mono">${money(total)}</div></div>
    <div class="stat"><div class="eyebrow">Cobrado</div><div class="n green mono">${money(cobrado)}</div></div>
    <div class="stat"><div class="eyebrow">Por cobrar</div><div class="n ${pend?'red':''} mono">${money(pend)}</div></div>
    <div class="stat"><div class="eyebrow">Personas</div><div class="n mono">${pax}</div></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="h2" style="margin-bottom:8px">Resultado del periodo</div>
    <table class="tbl">
      <tr><td>Cobrado</td><td class="r mono" style="color:var(--green)">${money(cobrado)}</td></tr>
      <tr><td>Instructores del periodo</td><td class="r mono">−${money(costo)} <span class="hint">(${money(costoPend)} sin pagar)</span></td></tr>
      <tr><td>Comisiones de socios</td><td class="r mono">−${money(comi)}</td></tr>
      <tr><td>Otras salidas de caja</td><td class="r mono">−${money(outOtros)}</td></tr>
      <tr><td><b>Neto</b></td><td class="r mono"><b style="color:${neto>=0?'var(--green)':'var(--red)'}">${money(neto)}</b></td></tr>
      ${credito?`<tr><td>Crédito de clientes</td><td class="r mono" style="color:var(--blue)">${money(credito)}</td></tr>`:''}
    </table>
  </div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><div class="h2" style="margin-bottom:6px">Por categoría</div>
      ${byCat.size?`<table class="tbl"><tr><th>Categoría</th><th class="r">#</th><th class="r">₡</th></tr>
      ${[...byCat].sort((a,b)=>b[1].v-a[1].v).map(([k,v])=>`<tr><td>${CATL[k]||k}</td><td class="r mono">${v.n}</td><td class="r mono">${money(v.v)}</td></tr>`).join('')}</table>`:'<div class="hint">Sin datos.</div>'}
    </div>
    <div class="card"><div class="h2" style="margin-bottom:6px">Por origen del cliente</div>
      ${bySrc.size?`<table class="tbl"><tr><th>Origen</th><th class="r">Reservas</th><th class="r">₡</th><th class="r">Comi.</th></tr>
      ${[...bySrc].sort((a,b)=>b[1].v-a[1].v).map(([k,v])=>{const s=DB.sources.find(x=>x.name===k);const cm=s&&s.comi?v.v*s.comi/100:0;
        return `<tr><td>${esc(k)}</td><td class="r mono">${v.n}</td><td class="r mono">${money(v.v)}</td><td class="r mono">${cm?money(cm):'—'}</td></tr>`;}).join('')}</table>`:'<div class="hint">Sin datos.</div>'}
    </div>
  </div>
  <div class="card"><div class="h2" style="margin-bottom:6px">Servicios más vendidos</div>
    ${bySvc.size?`<table class="tbl"><tr><th>Servicio</th><th class="r">Reg.</th><th class="r">Cant.</th><th class="r">₡</th></tr>
    ${[...bySvc].sort((a,b)=>b[1].v-a[1].v).slice(0,25).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r mono">${v.n}</td><td class="r mono">${v.q}</td><td class="r mono">${money(v.v)}</td></tr>`).join('')}</table>`:'<div class="hint">Sin datos.</div>'}
  </div>
  ${byOut.size?`<div class="card"><div class="h2" style="margin-bottom:6px">Salidas por tipo</div>
    <table class="tbl">${[...byOut].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r mono">${money(v)}</td></tr>`).join('')}
    <tr><td><b>Total salido de caja</b></td><td class="r mono"><b>${money(outTot)}</b></td></tr></table></div>`:''}
  <div class="card"><div class="h2" style="margin-bottom:8px">Exportar</div>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <button class="btn sm ghost" data-act="csv-lines">CSV de servicios</button>

function ajClientes(){
  const m=new Map();
  DB.bookings.forEach(b=>{ if(!b.client) return; const c=m.get(b.client)||{name:b.client,phone:b.phone,email:b.email,n:0,v:0,credito:0,source:b.source};
    const t=bookingTotals(b); c.n++; c.v+=t.total; c.credito+=t.credito; if(b.phone)c.phone=b.phone; if(b.email)c.email=b.email; m.set(b.client,c); });
  const list=[...m.values()].sort((a,b)=>b.v-a.v);
  return `<div class="card"><div class="between" style="margin-bottom:6px"><div class="h2">Clientes</div><span class="tag">${list.length}</span></div>

    <td class="r mono" style="color:${c.credito?'var(--blue)':'var(--muted)'}">${c.credito?money(c.credito):'—'}</td></tr>`).join('')}</table>`

}

/* ---- anotar rápido por código: "1C 2CU Soleida" o "2CU Soleida 8000" ---- */
function parseQuickInput(text){
  const trimmed=(text||'').trim();
  if(!trimmed) return null;
  const re=/(\d+)\s*([A-Za-zÁÉÍÓÚÑáéíóúñ]+)/g;
  const items=[], spans=[]; let m;
  while((m=re.exec(trimmed))!==null){
    const qty=parseInt(m[1],10);
    const codePart=m[2].toUpperCase();
    const c=DB.catalog.find(x=>(x.code||'').toUpperCase()===codePart && x.active!==false);
    if(c) items.push({qty,catalog:c}); else items.push({qty,error:true,attempted:codePart});
    spans.push([m.index, m.index+m[0].length]);
  }
  if(!items.length) return {raw:trimmed, error:'sin_formato'};
  let cursor=0; const nameParts=[];
  for(const [s,e] of spans){ if(s>cursor) nameParts.push(trimmed.slice(cursor,s)); cursor=e; }
  if(cursor<trimmed.length) nameParts.push(trimmed.slice(cursor));
  let client=nameParts.join(' ').replace(/\s+/g,' ').trim();
  let amountOverride=null;
  if(client){
    const parts=client.split(' ');
    const last=parts[parts.length-1];
    if(last && /^[0-9][0-9.,]*$/.test(last)){
      const n=parseInt(last.replace(/[.,]/g,''),10);
      if(!isNaN(n)){ amountOverride=n; parts.pop(); client=parts.join(' ').trim(); }
    }
  }
  const bad=items.filter(i=>i.error);
  if(bad.length) return {raw:trimmed, error:'codigo_desconocido', attempted:bad.map(b=>b.attempted).join(', ')};
  if(!client) return {raw:trimmed, error:'sin_nombre'};
  return {raw:trimmed, items, client, amountOverride};
}
function quickAdd(){
  const el=$('#quickCode'); if(!el) return;
  const res=parseQuickInput(el.value);
  if(!res || res.error==='sin_formato'){ toast('Escribí un código, ej. "1C Soleida"'); return; }
  if(res.error==='codigo_desconocido'){ toast('Código no reconocido: '+res.attempted); return; }
  if(res.error==='sin_nombre'){ toast('Falta el nombre del cliente'); return; }

function parseBakeInput(text){

  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);

/* ---------- Importar CSV (mismo formato que exporta la app, o desde Excel) ---------- */
function parseCSV(text){
  text=String(text).replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const first=text.split('\n')[0]||'';
  const counts={',':0,';':0,'\t':0};
  let q=false;
  for(const ch of first){ if(ch==='"') q=!q; else if(!q && ch in counts) counts[ch]++; }
  const D=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  const rows=[]; let row=[], cell='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=c; }
    else if(c==='"') inQ=true;
    else if(c===D){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
const num = v => { const x=parseFloat(String(v??'').replace(/[^0-9.,-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.')); return isNaN(x)?0:x; };
function normDate(v){
  const t=String(v||'').trim(); if(!t) return '';
  let m=t.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){ let[,a,b,y]=m; if(y.length===2)y='20'+y;
    let d=Number(a),mo=Number(b); if(d>12&&mo<=12){} else if(mo>12){ [d,mo]=[mo,d]; }
    return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  return '';
}
function importCSV(text){
  pushHistory('Importar CSV');
  const rows=parseCSV(text);
  if(rows.length<2){ toast('El archivo está vacío'); return; }
  const head=rows[0].map(h=>String(h).trim().toLowerCase().replace(/\s+/g,'_').replace(/[áàä]/g,'a').replace(/[éè]/g,'e').replace(/[íì]/g,'i').replace(/[óò]/g,'o').replace(/[úù]/g,'u'));
  const at=n=>head.indexOf(n);
  const G=(r,n)=>{ const i=at(n); return i<0?'':String(r[i]??'').trim(); };
  const body=rows.slice(1);

  if(at('servicio')>=0 || at('service')>=0) return importServices(body,G);
  if(at('monto')>=0 || at('amount')>=0)     return importOuts(body,G);
  toast('No reconozco las columnas. Usá un CSV exportado por la app.');
}
function importOuts(body,G){
  let n=0;
  body.forEach(r=>{
    const amt=num(G(r,'monto')||G(r,'amount')); if(!amt) return;
    DB.outs.unshift({id:uid(),date:normDate(G(r,'fecha'))||today(),type:(G(r,'tipo')||'OTHER').toUpperCase(),
      who:G(r,'recibe'),amount:n2(amt),method:G(r,'metodo')||DB.settings.defMethod||'CASH $',note:G(r,'nota')});
    n++;
  });
  save(); render(); toast(n+' salidas importadas');
}
function importServices(body,G){
  const catByLabel={}; Object.entries(CATL).forEach(([k,v])=>catByLabel[v.toLowerCase()]=k);
  const stageByLabel={}; Object.values(ALL_STAGES).forEach(st=>{ stageByLabel[st.label.toLowerCase()]=st.id; stageByLabel[st.id]=st.id; });
  const existing=new Set(DB.bookings.map(b=>b.code));
  const groups=new Map();
  let skipped=0;
  body.forEach(r=>{
    const code=G(r,'codigo')||G(r,'code');
    const key = code || ('__'+(G(r,'cliente')||'?')+'|'+(normDate(G(r,'fecha'))||today()));
    if(code && existing.has(code)){ skipped++; return; }
    if(!groups.has(key)) groups.set(key,{code:code||'',rows:[]});
    groups.get(key).rows.push(r);
  });
  let nb=0, ni=0, newCat=0;
  groups.forEach(({code,rows})=>{
    const r0=rows[0];
    const b={id:uid(), code: code || bookingCode(), stage:'lista', created:new Date().toISOString(),
      client:G(r0,'cliente')||'Sin nombre', phone:G(r0,'telefono'), email:G(r0,'email'),
      source:G(r0,'origen')||'WALK IN', date:normDate(G(r0,'fecha'))||today(), notes:G(r0,'nota_ticket')||'', items:[]};
    const st=stageByLabel[(G(r0,'etapa')||'').toLowerCase()]; if(st) b.stage=st;
    if(G(r0,'origen') && !DB.sources.some(x=>x.name===G(r0,'origen')))
      DB.sources.push({id:uid(),name:G(r0,'origen'),comi:0});
    rows.forEach(r=>{
      const name=(G(r,'servicio')||G(r,'service')).trim(); if(!name) return;
      const catLabel=(G(r,'categoria')||'').toLowerCase();
      let c=DB.catalog.find(x=>x.name.toLowerCase()===name.toLowerCase());
      const catId = c ? c.cat : (catByLabel[catLabel] || CATS.find(x=>x.id===catLabel)?.id || 'shop');
      const price=num(G(r,'precio'))||0;
      if(!c){ c={id:uid(),name,cat:catId,price,pay:0,comi:0,gprice:0,active:true}; DB.catalog.push(c); newCat++; }
      const est=(G(r,'estado_pago')||G(r,'pago')||'').toUpperCase();
      const pay = /CRED/.test(est)?'credit' : (/PEND|NO/.test(est)?'pending':'paid');
      const qty=Math.max(1,Math.round(num(G(r,'pax'))||num(G(r,'cantidad'))||1));
      const names=(G(r,'instructores')||'').split(/[|,;]/).map(x=>x.trim()).filter(Boolean);
      const totPay=num(G(r,'pago_instructores'));
      const assigns=names.map(nm=>{
        const ins=DB.instructors.find(x=>x.name.toLowerCase()===nm.toLowerCase());
        if(!ins) DB.instructors.push({id:uid(),name:nm,phone:'',active:true});
        return {id:uid(), instructorId:(ins&&ins.id)||'', name:(ins&&ins.name)||nm,
                amount:n2(totPay?totPay/names.length:(c.pay||0)*qty), paid:false};
      });
      const it={id:uid(),catId:c.id,name:c.name,cat:c.cat,qty,price:price||c.price||0,
        disc:num(G(r,'descuento')), time:(G(r,'hora')||'').slice(0,5),
        date:normDate(G(r,'fecha'))||b.date, dateOut:normDate(G(r,'salida')),
        perNight:c.cat==='stay' && !!normDate(G(r,'salida')),
        hours: c.cat==='rental' ? parseHours(c.name) : 0,
        returned: /^S|^Y|^1/i.test(G(r,'devuelta')),
        pay, method:G(r,'metodo'), beach:G(r,'playa'), level:G(r,'nivel'),
        note:G(r,'nota'), assigns};
      const tot=num(G(r,'total'));
      if(tot && Math.abs(lineTotal(it)-tot)>0.5 && qty) it.price=n2(tot/qty/(it.perNight?nights(it):1));
      b.items.push(it); ni++;
    });
    if(b.items.length){ normStage(b); DB.bookings.unshift(b); nb++; }
  });
  save(); render();
  toast(`${nb} tickets · ${ni} servicios importados${skipped?' · '+skipped+' filas repetidas omitidas':''}${newCat?' · '+newCat+' al catálogo':''}`);
}
function csvEscape(v){ const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }

/* ============================ MAREA Y MAR ============================
   Fuente: Open-Meteo Marine (gratis, sin llave, permite llamadas desde el navegador).
   Se descarga una vez al día y queda guardada, así funciona sin señal en la playa.
   Si algún día montamos servidor propio, se pone su URL en Ajustes y la app lee
   de ahí en vez de ir a Open-Meteo — la web y la app quedan con el mismo dato.  */
/* face = hacia dónde mira la playa, en grados. La costa de Nicoya mira al OSO (~250°).
   Sirve para saber si el viento es offshore (de la tierra al mar) o onshore. */
const SPOTS = [
  {name:'Santa Teresa', lat:9.644,  lng:-85.167, face:250},
  {name:'Playa Hermosa',lat:9.670,  lng:-85.175, face:252},
  {name:'Playa Carmen', lat:9.618,  lng:-85.156, face:248},
  {name:'Manzanillo',   lat:9.750,  lng:-85.200, face:255},
];
const MAR_VARS=['sea_level_height_msl','wave_height','wave_period','wave_direction',
  'swell_wave_height','swell_wave_period','swell_wave_direction',
  'secondary_swell_wave_height','secondary_swell_wave_period','secondary_swell_wave_direction',
  'wind_wave_height','wind_wave_period','wind_wave_direction','sea_surface_temperature'];
const WX_VARS=['wind_speed_10m','wind_direction_10m','wind_gusts_10m','temperature_2m',
  'apparent_temperature','relative_humidity_2m','precipitation_probability','weather_code','uv_index','cloud_cover'];
/* viento respecto a la playa */
function windKind(from, face){
  if(from===null||from===undefined) return null;
  const off=((face||250)+180)%360;
  let d=Math.abs(((from-off+540)%360)-180);
  if(d<=45)  return {k:'off',   label:'offshore',      tag:'green'};
  if(d<=85)  return {k:'xoff',  label:'cross-offshore',tag:'green'};
  if(d<=115) return {k:'cross', label:'cruzado',       tag:'amber'};
  if(d<=145) return {k:'xon',   label:'cross-onshore', tag:'amber'};
  return           {k:'on',    label:'onshore',       tag:'red'};
}
function tideURL(){
  const t=DB.settings.tide;
  if(t.proxy) return t.proxy;
  return 'https://marine-api.open-meteo.com/v1/marine?'+new URLSearchParams({
    latitude:t.lat, longitude:t.lng, hourly:MAR_VARS.join(','),
    timezone:'America/Costa_Rica', forecast_days:'4'});
}
function wxURL(){
  const t=DB.settings.tide;
  return 'https://api.open-meteo.com/v1/forecast?'+new URLSearchParams({
    latitude:t.lat, longitude:t.lng, hourly:WX_VARS.join(','), daily:'sunrise,sunset,uv_index_max,precipitation_sum,temperature_2m_max,temperature_2m_min',
    wind_speed_unit:'kn', timezone:'America/Costa_Rica', forecast_days:'4'});
}
let tideBusy=false;
async function tideLoad(force){
  const t=DB.settings.tide; if(!t.on) return;
  const c=DB.tideCache;
  const ageMin = c && c.at ? (Date.now()-new Date(c.at).getTime())/60000 : 1e9;
  const fresh = c && c.v===3 && c.day===today() && c.lat===t.lat && c.lng===t.lng && ageMin<60;
  if(!force && fresh) return;
  if(!force && !navigator.onLine) return;
  if(tideBusy) return; tideBusy=true;
  if(force) toast('Buscando parte de mar…');
  try{
    const [rm,rw]=await Promise.allSettled([
      fetch(tideURL(),{cache:'no-store'}),
      t.proxy?Promise.reject(0):fetch(wxURL(),{cache:'no-store'})
    ]);
    if(rm.status!=='fulfilled' || !rm.value.ok) throw new Error(rm.status==='fulfilled'?('HTTP '+rm.value.status):'sin red');
    const j=await rm.value.json();
    const h=j.hourly; if(!h || !h.time) throw new Error('respuesta rara');
    const lv=h.sea_level_height_msl||[];
    if(!lv.some(v=>v!==null && v!==undefined)) throw new Error('sin datos de marea acá');
    const cache={v:3, day:today(), at:new Date().toISOString(), lat:t.lat, lng:t.lng, spot:t.spot, face:t.face,
      time:h.time, level:lv};
    MAR_VARS.slice(1).forEach(k=>cache[k]=h[k]||[]);
    if(rw.status==='fulfilled' && rw.value.ok){
      try{
        const w=await rw.value.json();
        WX_VARS.forEach(k=>cache[k]=(w.hourly&&w.hourly[k])||[]);
        ['sunrise','sunset','uv_index_max','precipitation_sum','temperature_2m_max','temperature_2m_min']
          .forEach(k=>cache[k]=(w.daily&&w.daily[k])||[]);
      }catch(e){}
    }
    DB.tideCache=cache; save();
    if(force) toast('Parte de mar actualizado');
  }catch(err){
    if(force) toast(navigator.onLine?('No se pudo: '+err.message):'Sin conexión — se usa lo guardado');
  }
  tideBusy=false;
  if(TAB==='hoy'||TAB==='ajustes') render();
}
/* interpolación suave entre las horas para sacar picos y valles */
function tideAt(frac){
  const y=DB.tideCache.level, i=Math.max(0,Math.min(y.length-1,Math.floor(frac))), f=frac-i;
  const g=k=>{ const v=y[Math.max(0,Math.min(y.length-1,k))]; return typeof v==='number'?v:0; };
  const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
  return 0.5*(2*p1 + (-p0+p2)*f + (2*p0-5*p1+4*p2-p3)*f*f + (-p0+3*p1-3*p2+p3)*f*f*f);
}
/* la curva siempre se dibuja sobre HOY, aunque el caché arranque otro día */
function tideDayStart(){
  const c=DB.tideCache; if(!c||!c.time.length) return null;
  const t0=new Date(c.time[0]+':00').getTime();
  const mid=new Date(); mid.setHours(0,0,0,0);
  const i=(mid.getTime()-t0)/3600000;
  return (i<0 || i+24>c.time.length-1) ? null : i;
}
function tideIndexAt(date){
  const c=DB.tideCache; if(!c||!c.time.length) return null;
  const t0=new Date(c.time[0]+':00').getTime();
  const idx=(date.getTime()-t0)/3600000;
  return (idx<0 || idx>c.time.length-1) ? null : idx;
}
function tideExtremes(fromIdx,toIdx){
  const out=[]; const step=1/12;
  let prev=tideAt(fromIdx), cur=tideAt(fromIdx+step);
  for(let x=fromIdx+step; x<toIdx-step; x+=step){
    const next=tideAt(x+step);
    if((cur>=prev&&cur>=next)||(cur<=prev&&cur<=next)){
      const type=(cur>=prev&&cur>=next)?'high':'low';
      if(!out.length || out[out.length-1].type!==type || Math.abs(out[out.length-1].x-x)>1.5){
        out.push({x,h:cur,type});
      }
    }
    prev=cur; cur=next;
  }
  return out;
}
function tideClock(x){
  const c=DB.tideCache;
  const d=new Date(new Date(c.time[0]+':00').getTime()+x*3600000);
  return hhmm(d);
}
/* estado ahora: altura, si sube o baja, y el próximo pico */
function tideNow(){
  const c=DB.tideCache; if(!c) return null;
  const idx=tideIndexAt(new Date()); if(idx===null) return null;
  const h=tideAt(idx), rising=tideAt(Math.min(idx+0.25,c.level.length-1))>h;
  const ext=tideExtremes(Math.max(0,idx-0.2), Math.min(c.level.length-1, idx+14));
  const next=ext.find(e=>e.x>idx);
  const d0=tideDayStart();
  const day=(d0===null)?[]:tideExtremes(d0, d0+24);
  return Object.assign({h, rising, next, day, idx}, marAt(idx));
}
/* todas las variables del mar/viento en un índice horario dado */
function marAt(idx){
  const c=DB.tideCache; if(!c) return {};
  const i=Math.round(idx);
  const g=k=>{ const v=(c[k]||[])[i]; return typeof v==='number'?v:null; };
  return {

    wwH:g('wind_wave_height'), wwP:g('wind_wave_period'), wwD:g('wind_wave_direction'),

const DIRS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
/* ---- altura de ola en jerga de surfer (referencia al cuerpo) ---- */
const BODY=[[0.25,'tobillo'],[0.45,'rodilla'],[0.65,'muslo'],[0.85,'cintura'],[1.05,'panza'],
            [1.35,'pecho'],[1.60,'hombro'],[1.95,'cabeza'],[2.45,'sobre cabeza'],
            [3.10,'bien sobre cabeza'],[4.20,'doble cabeza'],[99,'triple cabeza']];
const bodyWord = m => (BODY.find(b=>m<b[0])||BODY[BODY.length-1])[1];
/* rango estimado de la ola rompiendo, a partir de la altura significativa del modelo */
function surfRange(m){
  if(m===null||m===undefined) return null;
  const lo=Math.max(0, m*0.85), hi=m*1.20;
  const a=bodyWord(lo), b=bodyWord(hi);
  return {lo, hi, slang: a===b ? ('a la '+a).replace('a la sobre','por sobre').replace('a la bien','bien').replace('a la doble','doble').replace('a la triple','triple')
                              : (a+' a '+b)};
}
/* ---- calificación: para surfear y para dar clases ---- */
const RATES=[[2.5,'Malo','red'],[4,'Flojo','red'],[5.5,'Regular','amber'],[6.8,'Bueno','amber'],
             [8.3,'Muy bueno','green'],[9.6,'Excelente','green'],[99,'Épico','green']];
const rateWord = v => RATES.find(r=>v<r[0])||RATES[RATES.length-1];
function rateSurf(m){
  const sw=m.swH!==null?m.swH:m.wave, per=m.swP!==null?m.swP:m.period;
  if(sw===null) return null;
  const wk=windKind(m.windDir, DB.settings.tide.face);
  let v=5;
  if(wk) v += {off:2.1,xoff:1.3,cross:0,xon:-1,on:-2}[wk.k];
  if(m.wind!==null){
    if(wk && wk.k!=='off' && wk.k!=='xoff'){ if(m.wind>18) v-=2; else if(m.wind>12) v-=1; }
    else if(m.wind>22) v-=0.5;
  }
  if(per!==null){ if(per>=16) v+=1.3; else if(per>=13) v+=0.9; else if(per>=11) v+=0.4; else if(per<9) v-=1; }
  const t=m.wave!==null?m.wave:sw;
  if(t<0.4) v-=3; else if(t<0.7) v-=1; else if(t<=2.2) v+=0.8; else if(t<=3) v+=0.4; else v-=0.5;
  v=Math.max(0,Math.min(10,v));
  const r=rateWord(v); return {v, label:r[1], tag:r[2]};
}
function rateLesson(m){
  const t=m.wave!==null?m.wave:m.swH, per=m.swP!==null?m.swP:m.period;
  if(t===null||t===undefined) return null;
  const wk=windKind(m.windDir, DB.settings.tide.face);
  let v=5;
  if(t<0.3) v-=2.5; else if(t<=1.0) v+=3; else if(t<=1.4) v+=1; else if(t<=1.8) v-=1.5; else v-=3.5;
  if(wk) v += {off:1,xoff:1,cross:0,xon:-1,on:-1.5}[wk.k];
  if(m.wind!==null && m.wind>16) v-=1;
  if(per!==null && per<8) v-=0.5;
  if(per!==null && per>16 && t>1.2) v-=1;
  v=Math.max(0,Math.min(10,v));
  const lab = v<3?['Peligroso','red'] : v<4.5?['Difícil','red'] : v<6?['Aceptable','amber'] :
              v<7.5?['Bueno','green'] : ['Ideal','green'];
  return {v, label:lab[0], tag:lab[1]};
}

/* curva del día con la hora actual y las clases marcadas */
function tideChart(items){
  const c=DB.tideCache, n=tideNow(); if(!c||!n) return '';
  const w=window.innerWidth, split=w>=1000, wide=w>=900&&w<1000;
  const W=split?520:(wide?920:400), H=split?164:(wide?186:148), PL=4,PR=4, PT=split?22:(wide?24:20), PB=split?28:(wide?30:28);
  const d0=tideDayStart(); if(d0===null) return '';
  const hrs=24;
  const pts=[]; for(let x=0;x<=hrs;x+=0.25) pts.push([x,tideAt(d0+x)]);
  const lo=Math.min(...pts.map(p=>p[1])), hi=Math.max(...pts.map(p=>p[1]));
  const rng=(hi-lo)||1;
  const X=x=>PL+(x/hrs)*(W-PL-PR);

  const area=path+` L ${X(hrs).toFixed(1)} ${H-PB} L ${X(0).toFixed(1)} ${H-PB} Z`;

    const [hh,mm]=String(o.it.time).split(':').map(Number);

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible;width:100%;height:auto" role="img" aria-label="Curva de marea del día">
